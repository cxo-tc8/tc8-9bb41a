<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO TC8｜已搬家</title>
<!-- 舊版成員儀表板（Apps Script + Google 試算表）已於 2026-08-26 退場。
     舊的後端 API 已失效（實測 404），留著這頁只會讓夥伴看到一份載入失敗的空名單。
     ⛔ 不並存：兩份真實來源必然不同步，總務會對到兩份名單。
     舊版原始碼在 git 歷史裡（這個檔案的上一版），資料仍在原本的 Google 試算表。 -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:#eef2f9;color:#16233d;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(16,24,40,.12);
       max-width:460px;width:100%;padding:34px 30px;text-align:center}
  .logo{width:84px;height:84px;border-radius:18px;margin:0 auto 18px;display:block}
  h1{font-size:1.35rem;font-weight:800;letter-spacing:.5px}
  p{margin-top:12px;line-height:1.75;color:#4a5878;font-size:.96rem}
  .btn{display:inline-block;margin-top:22px;background:linear-gradient(135deg,#15296B,#2B57C4);
       color:#fff;text-decoration:none;font-weight:800;padding:14px 30px;border-radius:99px;font-size:1rem}
  .hint{margin-top:16px;font-size:.82rem;color:#8a94ad}
  .url{margin-top:6px;font-size:.8rem;color:#6b7a99;word-break:break-all}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo.jpg" alt="CXO TC8" onerror="this.style.display='none'">
    <h1>這個網址已經搬家了</h1>
    <p>成員儀表板已升級成 <b>AI 案例與活動中心</b>：<br>
       夥伴名冊、月例會報名與訂餐、現場報到、AI 案例與 Q&amp;A、團購，全部在同一個地方。</p>
    <a class="btn" href="app.html">前往新網站</a>
    <p class="hint">3 秒後自動前往。請把新網址存進書籤或加到主畫面。</p>
  </div>
  <script>setTimeout(function(){ location.replace("app.html"); }, 3000);</script>
</body>
</html>
