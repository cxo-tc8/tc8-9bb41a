function downloadRoster(cols, postId){
  const r = window.__roster; if(!r) return;
  const p = POSTS.find(x => x.id === postId);
  const head = ["編號","姓名","專業別", ...cols, "飲食備註"];
  const rows = r.list.map((x,i) => [i+1, x.name, x.tag||"", ...cols.map(c => x.choices[c] || ""), x.diet_note || ""]);
  const esc2 = v => `"${String(v).replace(/"/g, '""')}"`;
  // \uFEFF 是 BOM：沒有它，Excel 開啟中文 CSV 會變亂碼
  const csv = "\uFEFF" + [head, ...rows].map(r2 => r2.map(esc2).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `報名名單_${(p&&p.title||"").replace(/[\\/:*?"<>|]/g,"")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ── 幹部：管這一場的餐點選項 ────────────────────────
// ⛔ 停用不刪除：刪掉之後，上個月報名的人選了什麼就查不到了
let MEAL_ALL = [];
async function openMeals(postId){
  if(!isOfficer()) return;
  const r = await signupApi("opt_all", {});
  MEAL_ALL = (r && r.options) || [];
  renderMeals(postId);
  go("form");
}
function renderMeals(postId){
  const p = POSTS.find(x => x.id === postId);
  const mine = MEAL_ALL.filter(m => m.post_id === postId);
  const shared = MEAL_ALL.filter(m => m.post_id === null);
  // ⚠️ 用跟報名表單同一套排序規則。原本這裡各寫一份，結果只改到一邊，
  //    幹部後台的「飲品」還是排在「餐點」前面。
  const all = [...mine, ...shared], gmin = {};
  all.forEach(m => { gmin[m.grp] = Math.min(gmin[m.grp] ?? 9e9, m.sort); });
  const groups = [...new Set(all.map(m => m.grp))]
    .sort((a, b) => (gmin[a] - gmin[b]) || a.localeCompare(b));
  const row = m => `
    <div class="mrow${m.active ? "" : " off"}">
      <input class="mi-label" value="${esc(m.label)}" placeholder="名稱">
      <input class="mi-price" type="number" value="${m.price}" placeholder="0">
      <input class="mi-stock" type="number" value="${m.stock}" title="-1 = 不限量（一般都填 -1）">
      <input class="mi-sort" type="number" value="${m.sort}" title="數字小的排前面">
      <button class="mbtn save" onclick="saveMeal(${m.id}, ${postId}, this)">存</button>
      <button class="mbtn" onclick="toggleMeal(${m.id}, ${!m.active}, ${postId})">${m.active ? "停用" : "啟用"}</button>
    </div>`;

  el("v-form").innerHTML = `
    ${backBar()}
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">餐點選項　${esc(p ? p.title : "")}</div>
      <div style="color:var(--muted);font-size:.85rem;margin-top:6px;line-height:1.7">
        每個月的菜色不一樣，在這裡改就好，不必找人改程式。<br>
        <b>庫存一般用不到，留 −1 就好</b>（−1 = 不限量，訂幾份就幾份）。<br>
        只有真的限量的東西才填數字，例如「手工甜點只做 10 份」，選完會自動變「已額滿」。<br>
        <b>排序</b>數字小的排前面，它也決定群組的先後（想讓餐點排在飲品前面就把餐點的數字調小）。<br>
        不要的選項按「停用」<b>不要刪掉</b>——刪了的話，以前報名的人選了什麼就查不到了。
      </div>
      ${groups.map(g => `
        <div class="field" style="margin-top:20px">
          <label>${esc(g)}</label>
          <div class="mhead"><span>名稱</span><span>價格</span><span>庫存</span><span>排序</span><span></span><span></span></div>
          ${mine.filter(m => m.grp === g).map(row).join("")}
          ${shared.filter(m => m.grp === g).map(m => `
            <div class="mrow${m.active ? "" : " off"}" style="opacity:.7">
              <input value="${esc(m.label)}" disabled>
              <input value="${m.price}" disabled><input value="${m.stock}" disabled>
              <input value="${m.sort}" disabled><span class="mnote">每場通用</span><span></span>
            </div>`).join("")}
          <button class="mbtn add" onclick="addMeal('${escAttr(g)}', ${postId})">＋ 加一個${esc(g)}選項</button>
        </div>`).join("")}
      <div class="field" style="margin-top:22px">
        <label>加一個新群組</label>
        <div class="help">例如「點心」。加了之後報名的人就要各選一項。不必改程式</div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <input type="text" id="m_newgrp" placeholder="群組名稱，例如：點心" style="flex:1;min-width:0">
          <button class="mbtn" style="flex:none;color:var(--blue-500);border-style:dashed" onclick="addGroup(${postId})">建立</button>
        </div>
      </div>
    </div>`;
}
async function saveMeal(id, postId, btn){
  const r = btn.closest(".mrow");
  btn.disabled = true; btn.textContent = "…";
  const res = await signupApi("opt_save", {
    id, post_id: postId,
    grp: MEAL_ALL.find(m => m.id === id).grp,
    label: r.querySelector(".mi-label").value.trim(),
    price: Number(r.querySelector(".mi-price").value) || 0,
    stock: Number(r.querySelector(".mi-stock").value),
    sort: Number(r.querySelector(".mi-sort").value) || 0,
  });
  btn.disabled = false; btn.textContent = "存";
  if(!res || !res.ok){ alert((res && res.message) || "存檔失敗"); return; }
  await reloadSeats(); await openMeals(postId);
}
async function toggleMeal(id, active, postId){
  const res = await signupApi("opt_toggle", {id, active});
  if(!res || !res.ok){ alert("失敗"); return; }
  await reloadSeats(); await openMeals(postId);
}
async function addMeal(grp, postId){
  const label = prompt(`新的「${grp}」選項名稱`); if(!label) return;
  const sameGrp = MEAL_ALL.filter(m => m.grp === grp);
  const sort = (sameGrp.length ? Math.max(...sameGrp.map(m => m.sort)) : 0) + 10;
  const res = await signupApi("opt_save", {post_id: postId, grp, label, price: 0, stock: -1, sort});
  if(!res || !res.ok){ alert((res && res.message) || "新增失敗"); return; }
  await reloadSeats(); await openMeals(postId);
}
async function addGroup(postId){
  const grp = (el("m_newgrp").value || "").trim(); if(!grp) return;
  const label = prompt(`「${grp}」的第一個選項名稱`); if(!label) return;
  const sort = (MEAL_ALL.length ? Math.max(...MEAL_ALL.map(m => m.sort)) : 0) + 100;
  const res = await signupApi("opt_save", {post_id: postId, grp, label, price: 0, stock: -1, sort});
  if(!res || !res.ok){ alert((res && res.message) || "新增失敗"); return; }
  await reloadSeats(); await openMeals(postId);
}

async function submitSignup(postId, btn){
  const groups = mealGroups(postId);
  const missing = groups.filter(g => !SIGNUP_PICK[g]);
  if(missing.length){ alert("還沒選：" + missing.join("、")); return; }
  btn.disabled = true; btn.textContent = "送出中…";
  const r = await signupApi("register", {
    post_id: postId, meal_choices: SIGNUP_PICK, diet_note: (el("s_diet").value || "").trim(),
  });
  await reloadSeats();
  if(r && r.ok){
    go(FORM_FROM); refreshCurrent();
    alert(r.already ? "已更新你的餐點" : "報名完成！");
  }else{
    // 餐點被搶走時後端會告訴我們還剩哪些可選，直接講給他聽，不要只說「失敗」
    let msg = (r && r.message) || "報名失敗，請再試一次";
    if(r && r.error === "OPTION_SOLD_OUT" && (r.alternatives || []).length){
      msg += "\n\n還可以選：" + r.alternatives.map(a => a.label).join("、");
    }
    openSignup(postId);   // 重開表單，帶著剛更新的售罄狀態
    alert(msg);
  }
}

async function doSignup(postId, btn){
  if(btn){ btn.disabled = true; btn.textContent = "報名中…"; }
  const r = await signupApi("register", {post_id: postId});
  if(r && r.ok){
    await reloadSeats();
    refreshCurrent();
    alert(r.already ? "你已經報名過這一場了" : "報名完成！");
  }else{
    // 席次是搶的，失敗要讓畫面立刻反映真實數字，不能停在舊的「剩 1 位」
    await reloadSeats();
    refreshCurrent();
    alert((r && r.message) || "報名失敗，請再試一次");
  }
}

async function api(action, body){
  const h={"Content-Type":"application/json"}; const t=token(); if(t) h.Authorization="Bearer "+t;
  const r=await fetch(SB+"/functions/v1/cases",{method:"POST",headers:h,body:JSON.stringify({action,...body})});
  return r.json();
}
async function fn(action, body){
  const h = {"Content-Type":"application/json"};
  const t = token(); if(t) h.Authorization = "Bearer "+t;
  const r = await fetch(FN, {method:"POST", headers:h, body:JSON.stringify({action, ...body})});
  return r.json();
}

// ── 「有新東西」紅點 ────────────────────────────────
// ⭐ 用「你上次看過之後新增幾則」，不是「最近 N 天發布」——
//    後者你昨天才看完、今天紅點還在，看三次就麻痺了。點進去看過就消失，紅點才有意義。
// 記在這台裝置的 localStorage：換手機會重新算，但省掉一張表與每次讀寫的往返。
const SEEN_KEY = v => "tc8_seen_" + v;
function seenAt(v){
  try{
    const t = localStorage.getItem(SEEN_KEY(v));
    if(t) return new Date(t);
    // 第一次使用：把「現在」當基準，否則一進來每個分頁都是紅的
    const now = new Date().toISOString();
    localStorage.setItem(SEEN_KEY(v), now);
    return new Date(now);
  }catch(e){ return new Date(); }   // 無痕模式讀不到就當作沒有新東西
}
function markSeen(v){
  try{ localStorage.setItem(SEEN_KEY(v), new Date().toISOString()); }catch(e){}
}
// 每個分頁「算什麼是新的」
function newItems(v){
  const since = seenAt(v);
  const after = x => x && new Date(x) > since;
  if(v === "notices") return POSTS.filter(p => (p.kind==="notice"||p.kind==="survey") && after(p.created_at));
  if(v === "acts")    return POSTS.filter(p => ["monthly","event","member_event"].includes(p.kind) && after(p.created_at));
  if(v === "cases")   return CASES.filter(c => after(c.created_at));
  if(v === "needs")   return NEEDS.filter(n => after(n.created_at));
  if(v === "buys")    return BUYS.filter(b => b.status === "open" && after(b.created_at));
  return [];
}

    if(!dot){ dot = document.createElement("span"); dot.className = "newdot"; b.appendChild(dot); }
    dot.textContent = n > 9 ? "9+" : n;
  });
}

function lineLogin(){
  const state = Math.random().toString(36).slice(2);
  localStorage.setItem("tc8_state", state);   // 用 localStorage：LINE 授權可能換分頁，sessionStorage 會遺失
  location.href = "https://access.line.me/oauth2/v2.1/authorize?response_type=code"
    + "&client_id=" + LINE_CHANNEL_ID
    + "&redirect_uri=" + encodeURIComponent(REDIRECT)
    + "&state=" + state + "&scope=" + encodeURIComponent("openid profile");
}
function onMe(){ ME ? go("me") : lineLogin(); }

async function handleCallback(){
  const p = new URLSearchParams(location.search);
  const code = p.get("code"), state = p.get("state");
  if(!code) return false;
  const saved = localStorage.getItem("tc8_state");
  if(saved && state !== saved){
    history.replaceState({},"",REDIRECT);
    el("v-home").innerHTML = `<div class="center"><div class="err">
      登入驗證沒對上，請再按一次登入。<br><span style="font-size:.8rem">（若一直如此，換用同一個瀏覽器分頁再試）</span></div>
      <button class="linebtn" style="margin-top:12px" onclick="lineLogin()">再登入一次</button></div>`;
    return true;
  }
  el("v-home").innerHTML = '<div class="busy">登入中…</div>';
  const r = await fn("callback", {code, redirect_uri: REDIRECT});
  history.replaceState({},"",REDIRECT);
  DBG("callback 回傳", r);
  if(r.error){
    el("v-home").innerHTML = `<div class="center"><div class="err">登入失敗：${esc(r.error)}</div>
      <button class="linebtn" style="margin-top:12px" onclick="lineLogin()">再試一次</button></div>`;
    return true;
  }
  if(r.token) localStorage.setItem("tc8_token", r.token);
  if(r.line_name) window.__lineName = r.line_name;   // 認領時要一起存起來
  if(r.status === "unbound"){ go("claim"); return true; }
  if(r.status === "bound"){ await loadMe(); go("me"); return true; }
  return false;
}

// 上傳前在瀏覽器就壓縮：手機拍的照片動輒 3–5MB，直接傳會塞爆也會慢到沒人看
function pickPhoto(folder, onDone, maxSize){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    onDone({loading:true});
    try{
      const url=await compressAndUpload(file, folder, maxSize);
      onDone({url});
    }catch(e){ onDone({error:String(e.message||e)}); }
  };

async function compressAndUpload(file, folder, maxSize){
  const img=await new Promise((res,rej)=>{ const i=new Image();
    i.onload=()=>res(i); i.onerror=()=>rej(new Error("讀不到這張圖")); i.src=URL.createObjectURL(file); });
  const MAX = maxSize || 800;          // 頭像 800 就夠；活動照要看得清楚，用 1200
  const r=Math.min(1, MAX/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const dataUrl=c.toDataURL("image/jpeg",0.82);
  const res=await postApi("upload",{data:dataUrl, folder});
  if(res.error) throw new Error(res.error);
  return res.url;
}

const byKind = k => {
  // 過期的夥伴活動不進首頁；主辦人自己在「我的張貼」還是找得到，可以改可以刪
  const list = POSTS.filter(p => p.kind === k && !isOverMemberEvent(p));
  if(k === "monthly"){
    // 未來的場次優先、由近而遠；都過去了就拿最近辦過的那場
    const now = Date.now();
    const future = list.filter(p => p.event_at && new Date(p.event_at) >= now)
                       .sort((a,b) => new Date(a.event_at) - new Date(b.event_at));
    if(future.length) return future;
    return list.sort((a,b) => new Date(b.event_at||b.created_at) - new Date(a.event_at||a.created_at));
  }
  if(k === "event" || k === "member_event" || k === "survey"){
    // 快到期的排前面；沒填日期的排最後
    return list.sort((a,b) => {
      if(!a.deadline && !b.deadline) return new Date(b.created_at) - new Date(a.created_at);
      if(!a.deadline) return 1;
      if(!b.deadline) return -1;
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
  }
  return list.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
};

// 距離到期還有幾天——快到的講「剩 N 天」，遠的講日期
// 活動日期怎麼講：單日講日期、跨日講區間、快到了講剩幾天
// 地點一律可以點開 Google 地圖：貼了網址就用那個網址，只寫地名就拿地名去搜。
// ⛔ 不另外開一個「地圖網址」欄位——那要改資料庫，夥伴也得多填一次；
//    地點欄位本來就在，讓它同時吃得下「名稱」與「名稱＋網址」就夠了。
// 線上活動沒有實體地點，接去 Google 地圖搜尋「線上課」只會得到一堆無關的店家
const ONLINE_PLACE = /^(線上|online|遠距|直播|zoom|google\s*meet|meet|teams|webex)/i;
function placeChip(place, inCard){
  const t = String(place || "").trim();
  if(!t) return "";
  const m = t.match(/https?:\/\/\S+/);
  // 沒附網址、又看起來是線上場 → 純文字，不做連結
  if(!m && ONLINE_PLACE.test(t)) return `<span class="pplain">💻 ${esc(t)}</span>`;
  const url = m ? m[0] : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(t);
  const label = m ? (t.replace(m[0], "").trim() || (inCard ? "看地圖" : "在 Google 地圖開啟")) : t;
  // ⛔ 卡片與橫幅整張本來就可以點進詳情頁，地點連結一定要 stopPropagation，
  //    否則按地圖會同時把詳情頁也打開，兩件事一起發生。
  return `<a class="maplink" href="${escAttr(url)}" target="_blank" rel="noopener"${
    inCard ? ` onclick="event.stopPropagation()"` : ""}>📍 ${esc(label)}</a>`;
}
function placeRow(place){
  const chip = placeChip(place, false);
  return chip ? `<div class="block"><div class="lbl">地點</div><p>${chip}</p></div>` : "";
}

function whenLabel(p){
  const s0=p.start_date, e0=p.deadline;
  if(!s0 && !e0) return "";
  const fmt = d => d.slice(5).replace("-","/");
  const today=new Date(); today.setHours(0,0,0,0);
  const days = d => Math.round((new Date(d+"T00:00:00") - today)/864e5);
  if(s0 && e0 && s0!==e0){
    const ds=days(s0), de=days(e0);
    if(de < 0) return "已結束";
    if(ds > 0) return `${fmt(s0)}–${fmt(e0)}` + (ds<=7?`　・　${ds} 天後開始`:"");
    return `${fmt(s0)}–${fmt(e0)}　・　進行中`;
  }
  return dueLabel(e0 || s0);
}

function dueLabel(d){
  // 比「日期」不是比「時刻」——用小時差進位會把今天算成剩 1 天
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(d + "T00:00:00");
  const days = Math.round((due - today)/864e5);
  if(days < 0)  return "已結束";
  if(days === 0) return "今天最後一天";
  if(days <= 7)  return `剩 ${days} 天`;
  return `到 ${d.slice(5).replace("-","/")}`;
}

function openPostDetail(id){
  const p = POSTS.find(x=>x.id===id); if(!p) return;
  PDETAIL_ID = id;
  const canEdit = ME && (p.author_id===ME.id || isOfficer());
  // 這頁也是共用的，一樣要記住從哪裡點進來

  const r = await fn(act, {id});

}

function addHelper(){
  const sel = el("helpersel"); const id = Number(sel.value);
  sel.value = "";

  HELPERS.push(id); renderHelpers();
}
function removeHelper(id){ HELPERS = HELPERS.filter(x=>x!==id); renderHelpers(); }
function renderHelpers(){
  el("helperchips").innerHTML = HELPERS.map(id=>
    `<button type="button" class="pill on" onclick="removeHelper(${id})">${esc(memberName(id))} ×</button>`).join("")
    || `<span class="hint">還沒選（可以不選，直接按確認）</span>`;
}
async function confirmClose(needId){
  const r = await api("need_close", {id: needId, helpers: HELPERS});
  if(r.error) return alert(r.error);
  await reloadNeeds(); openNeedDetail(needId);
}

function commentBlock(kind, targetId){
  const list = COMMENTS.filter(c => c.kind===kind && c.target_id===targetId);
  const rows = list.map(c => {
    const canDel = ME && (c.member_id===ME.id || ME.role==="officer");
    return `<div class="cmt">
      ${avatar(memberName(c.member_id))}
      <div style="flex:1;min-width:0">
        <div class="cmthead"><span class="cmtname">${esc(memberName(c.member_id))}</span>
          <span class="cmttime">${ago(c.created_at)}</span></div>
        <div class="cmtbody">${esc(c.body)}</div>
      </div>
      ${canDel?`<button class="cmtdel" onclick="delComment(${c.id},'${kind}',${targetId})" aria-label="刪除">×</button>`:""}
    </div>`;
  }).join("");

  const total = cmtCount(kind, targetId);
  return `<div class="sec"><h2>討論</h2>${total?`<span class="more">${total}</span>`:""}</div>
    <div class="card" id="cmtlist">
      ${!ME
        ? `<div class="empty" style="padding:26px 20px">${total
            ? `這裡有 <b>${total}</b> 則討論<br><span style="font-size:.82rem">用 LINE 登入後就看得到內容</span>`
            : "還沒有人留言"}</div>`
        : (rows || `<div class="empty" style="padding:26px 20px">還沒有人留言<br><span style="font-size:.82rem">有想法、有人選、有做法，都可以寫在下面</span></div>`)}
    </div>
    ${ME ? `<div class="cmtbox">
      <textarea id="cmtinput" rows="2" placeholder="寫下你的想法或建議…" maxlength="1000"></textarea>
      <div id="cmterr"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-primary btn-sm" id="cmtsend" onclick="sendComment('${kind}',${targetId})">送出留言</button>
      </div></div>`
      : `<div class="hint" style="text-align:center;margin-top:10px">用 LINE 登入後就可以留言</div>`}`;
}

async function sendComment(kind, targetId){
  const inp = el("cmtinput"), btn = el("cmtsend");
  const body = (inp.value||"").trim();
  if(!body){ el("cmterr").innerHTML = '<div class="err">還沒寫東西</div>'; return; }
  btn.disabled = true; btn.textContent = "送出中…";
  const r = await api("comment_add", {kind, target_id: targetId, body});
  if(r.error){ el("cmterr").innerHTML = `<div class="err">${esc(r.error)}</div>`;
    btn.disabled=false; btn.textContent="送出留言"; return; }
  await reloadComments();
  reopenTarget(kind, targetId);
}
// 留言送出／刪除後要回到原來那一頁——活動也是留言的對象了，不能只認得需求與案例
function reopenTarget(kind, targetId){
  if(kind==="need") openNeedDetail(targetId);
  else if(kind==="case") openCase(targetId);
  else if(kind==="post") openPostDetail(targetId);
}

async function delComment(id, kind, targetId){
  if(!confirm("確定刪除這則留言嗎？")) return;
  const r = await api("comment_delete", {id});
  if(r.error) return alert(r.error);
  await reloadComments();
  reopenTarget(kind, targetId);
}

// 點讚：數字走公開 view，我按過哪些要驗身分
async function reloadReacts(){
  try{
    const rows = await rest("v_reaction_counts?select=kind,target_id,cnt");
    REACTS = Object.fromEntries(rows.map(r => [r.kind + ":" + r.target_id, r.cnt]));
  }catch(e){ REACTS = {}; console.error("點讚數讀取失敗", e); }
  MY_REACTS = new Set();
  if(token()){
    try{
      const r = await api("react_mine", {});
      if(r && r.ok) MY_REACTS = new Set((r.reactions||[]).map(x => x.kind + ":" + x.target_id));
    }catch(e){ console.error("我的點讚讀取失敗", e); }
  }
}
async function reloadStreak(){
  STREAK = {}; STREAK_SESSIONS = 0;
  if(!token()) return;
  try{
    const r = await checkinApi("streak", {});
    if(r && r.ok){
      STREAK_SESSIONS = r.sessions || 0;
      STREAK = Object.fromEntries((r.list||[]).map(x => [x.member_id, x.streak]));
    }
  }catch(e){ console.error("連續缺席讀取失敗", e); }
}
// 退社提醒的燈：連續 3 次沒到就是要談的對象，2 次先預警。
// ⛔ 母數不足時一律不亮——系統才上線、只數得到 1 場的時候，
//    每個沒來過的人都會是「連續 1 次」，那不是資訊，是雜訊。
function streakTag(memberId){
  const n = STREAK[memberId] || 0;
  if(STREAK_SESSIONS < 3 || n < 2) return "";
  return n >= 3
    ? `<span class="stag red">🔴 連續 ${n} 次沒到</span>`
    : `<span class="stag amber">🟡 連續 2 次沒到</span>`;
}
const likeCount = (kind, id) => REACTS[kind + ":" + id] || 0;
const cmtCount  = (kind, id) => CMT_COUNTS[kind + ":" + id] || 0;

// 點讚列：未登入看得到數字、看不到名字（羅伯特 2026-08-26 決定）
function likeBar(kind, id){
  const key = kind + ":" + id, n = likeCount(kind, id), liked = MY_REACTS.has(key);
  return `<div class="likebar">
    ${ME
      ? `<button class="btn ${liked?"btn-primary":"btn-ghost"} btn-sm" onclick="toggleLike('${kind}',${id})">${
          liked?"👍 已讚":"👍 讚"}${n?"　"+n:""}</button>`
      : `<span style="color:var(--muted)">👍 ${n} 個讚</span>`}
    ${ME ? "" : `<span class="hint">用 LINE 登入後可以按讚、留言</span>`}
    <div id="wholiked" style="flex:1;min-width:0;color:var(--muted);font-size:.85rem"></div>
  </div>`;
}
async function toggleLike(kind, id){
  const r = await api("react_toggle", {kind, target_id: id});
  if(r.error) return alert(r.error);
  const key = kind + ":" + id;
  REACTS[key] = r.cnt;
  if(r.liked) MY_REACTS.add(key); else MY_REACTS.delete(key);
  // 重畫這一頁（數字在卡片列表也會用到，回頭就會是新的）
  if(kind === "post") openPostDetail(id); else openCase(id);
}
// 誰按了讚——登入的人一進頁面名字就自己出現，不用再按一顆按鈕
// ⛔ 但名字仍然只從後端驗身分後取得：未登入的人看得到數字、看不到名字，
//    這條線是在資料庫層成立的（reactions 整張表 revoke），不是靠前端不畫。
async function loadLikers(kind, id){
  if(!ME || !likeCount(kind, id)) return;
  const r = await api("react_who", {kind, target_id: id});
  const box = el("wholiked");
  // 使用者可能在等待期間就翻頁了，回來時這個框已經不是同一個
  if(!box || r.error) return;
  const names = (r.list||[]).map(x => esc(x.name)).filter(Boolean);
  if(names.length) box.textContent = names.join("、");
}

async function reloadComments(){
  // 數字：公開，未登入也看得到「有幾則」
  try{
    const rows = await rest("v_comment_counts?select=kind,target_id,cnt");
    CMT_COUNTS = Object.fromEntries(rows.map(r => [r.kind + ":" + r.target_id, r.cnt]));
  }catch(e){ CMT_COUNTS = {}; console.error("留言則數讀取失敗", e); }
  // 內容：comments 整張表已對外 revoke，只能驗身分後取得
  COMMENTS = [];
  if(!token()) return;
  try{
    const r = await api("comment_list", {});
    if(r && r.ok) COMMENTS = r.comments || [];
  }catch(e){ console.error("留言讀取失敗", e); }
}

function filterNeeds(){
  const q=(el("nq")?.value||"").trim().toLowerCase();
  const f=el("nfilter")?.querySelector(".chip.on")?.dataset.f || "all";
  let list = NEEDS.filter(n => f==="all" ? true : f==="closed" ? !!n.closed_at : !n.closed_at);
  if(q) list = list.filter(n => [n.title,n.problem,n.tried,memberName(n.member_id)].some(x=>(x||"").toLowerCase().includes(q)));
  el("nlist").innerHTML = list.map(needRow).join("") ||
    `<div class="empty">${NEEDS.length?"這個條件下沒有問題":"還沒有人提問"+(ME?'<br><span style="font-size:.82rem">按上面「我要提問」，會自動掛你的名字</span>':"")}</div>`;
}

async function saveNeed(id){
  const b=el("n_save"); b.disabled=true; b.textContent="送出中…";
  const r = await api(id?"need_update":"need_create", {
    id, title:el("n_title").value, problem:el("n_problem").value, tried:el("n_tried").value,
    detail:el("n_detail").value,
    urgency: el("n_urg").querySelector(".pill.on")?.dataset.u || "mid",
    tags: [...el("n_tags").querySelectorAll(".pill.on")].map(x=>x.dataset.t)});
  if(r.error){ el("n_err").innerHTML=`<div class="err">${esc(r.error)}</div>`;
    b.disabled=false; b.textContent=id?"儲存":"送出"; return; }
  await reloadNeeds(); openNeedDetail(r.need.id);
}
async function toggleNeed(id, done){
  const r = await api(done?"need_reopen":"need_close", {id});
  if(r.error) return alert(r.error);
  await reloadNeeds();
  if(el("v-ndetail").classList.contains("on")) openNeedDetail(id); else filterNeeds();
}
async function delNeed(id){
  if(!confirm("確定要刪除嗎？如果只是已經解決了，用「已經找到了」比較好——別人還看得到你解過什麼。")) return;
  const r = await api("need_delete", {id});
  if(r.error) return alert(r.error);
  await reloadNeeds(); go("needs");
}
async function reloadNeeds(){
  NEEDS = await rest("ai_needs?select=id,member_id,title,problem,tried,urgency,detail,tags,closed_at,helpers,created_at&order=created_at.desc");
}

const MAX_PHOTOS = 3;
function albumList(){ try{ return JSON.parse(el("p_photos").value||"[]"); }catch{ return []; } }
function renderAlbum(){
  const list = albumList();
  el("p_album").innerHTML =
    list.map((u,i)=>`<div class="thumb">
        <img src="${esc(u)}" alt="">
        ${i===0?`<span class="coverbadge">封面</span>`:""}
        <button type="button" class="thumbx" onclick="removePhoto(${i})" aria-label="移除">×</button>
      </div>`).join("") +
    (list.length < MAX_PHOTOS
      ? `<button type="button" class="addphoto" onclick="addPhoto()">＋<span>加照片</span><small>${list.length}/${MAX_PHOTOS}</small></button>`
      : `<div class="addphoto" style="opacity:.5;cursor:default"><small>已達 ${MAX_PHOTOS} 張上限</small></div>`);
}
function addPhoto(){
  pickPhoto("event", st=>{
    if(st.loading){ el("p_album").insertAdjacentHTML("beforeend",'<div class="thumb" id="uploading" style="display:grid;place-items:center;font-size:.75rem;color:var(--muted)">上傳中…</div>'); return; }
    const tmp=el("uploading"); if(tmp) tmp.remove();
    if(st.error){ alert(st.error); return; }
    const list=albumList(); list.push(st.url);
    el("p_photos").value=JSON.stringify(list.slice(0,MAX_PHOTOS));
    renderAlbum();
  }, 1200);
}
function removePhoto(i){
  const list=albumList(); list.splice(i,1);
  el("p_photos").value=JSON.stringify(list); renderAlbum();
}

let MSGKIND = "notice";
function switchMsgType(k){
  MSGKIND = k;
  el("p_msgtype").querySelectorAll(".pill").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  el("noticefields").style.display = (k==="survey")?"none":"block";
  el("surveyfields").style.display = k==="survey" ? "block" : "none";
  el("p_save").textContent = el("p_save").dataset.editing==="1" ? "儲存" : (k==="survey"?"發布問卷":"發布公告");
}

// 從名冊選一位夥伴（用來指定「講者是誰」，指定後他本人才改得動自己那一段）
function memberSelect(id, current){
  const list = [...MEMBERS].sort((a,b) => (a.name||"").localeCompare(b.name||"", "zh-Hant"));
  return `<select id="${id}" class="dateinput" style="width:100%">
    <option value="">（不指定／外部講者）</option>
    ${list.map(m => `<option value="${m.id}"${Number(current)===m.id?" selected":""}>${esc(m.name)}${
      m.company?`（${esc(m.company)}）`:""}</option>`).join("")}
  </select>`;
}

function photoField(id, label, current){
  return `<div class="field"><label>${label}</label>
    <div class="help">選一張就好，會自動縮小再上傳</div>
    <div class="photobox" id="${id}_box">
      ${current?`<img src="${esc(current)}" alt=""><button type="button" class="btn btn-ghost btn-sm" onclick="clearPhoto('${id}')">移除</button>`
        :`<button type="button" class="btn btn-ghost btn-sm" onclick="choosePhoto('${id}')">選擇照片</button>`}
    </div>
    <input type="hidden" id="${id}" value="${current?esc(current):""}"></div>`;
}
function choosePhoto(id){
  pickPhoto("speaker", st=>{
    const box=el(id+"_box");
    if(st.loading){ box.innerHTML='<span style="color:var(--muted);font-size:.85rem">上傳中…</span>'; return; }
    if(st.error){ box.innerHTML=`<span style="color:#b4261a;font-size:.85rem">${esc(st.error)}</span>
      <button type="button" class="btn btn-ghost btn-sm" onclick="choosePhoto('${id}')">重試</button>`; return; }
    el(id).value=st.url;
    box.innerHTML=`<img src="${esc(st.url)}" alt=""><button type="button" class="btn btn-ghost btn-sm" onclick="clearPhoto('${id}')">移除</button>`;
  });
}
function clearPhoto(id){
  el(id).value="";
  el(id+"_box").innerHTML=`<button type="button" class="btn btn-ghost btn-sm" onclick="choosePhoto('${id}')">選擇照片</button>`;
}

function openPost(kind, id){
  if(!ME){ go("me"); return; }
  const p = id ? POSTS.find(x=>x.id===id) : null;
  const F = {
    // album＝活動照片／海報。月例會原本沒有這一格，所以它的橫幅只能用底色撐著
    monthly:      ["body","speaker","photo1","speaker2","photo2","place","event_at","entry","capacity","signup","album"],
    event:        ["speaker_free","place","dates","time","fee","body","link","album"],
    notice:       ["msgtype","body"],
    survey:       ["msgtype","body"],
    member_event: ["body","place","dates","time","fee","link","album"],
  }[kind] || ["body"];
  const has = f => F.includes(f);
  const val = f => p && p[f]!=null ? esc(p[f]) : "";
  // datetime-local 要的是「當地時間」字串。
  // ⛔ 不可以用 toISOString()：那是 UTC，塞進去會少 8 小時，
  //    而存檔時又把它當成當地時間轉回 UTC → **每編輯一次就退 8 小時**，
  //    退到跨日就變前一天（9/24 → 9/23 → 9/22）。讀寫要用同一套時區假設。
  // 把資料庫存的時間拆成台灣的「日期」與「時間」兩格。
  // ⛔ 不用 toISOString()（那是 UTC，會少 8 小時），也不靠瀏覽器時區——
  //    夥伴出差到日本、或手機時區設錯，看到的時間都必須是台灣時間。
  const twParts = iso => {
    if(!iso) return {date:"", time:""};
    const d = new Date(iso);
    const date = d.toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"});          // YYYY-MM-DD
    const time = d.toLocaleTimeString("sv-SE", {timeZone:"Asia/Taipei", hour12:false}).slice(0,5); // HH:MM
    return {date, time};

      ${has("capacity")?`<div class="field"><label>人數上限</label>

      ${has("signup")?`<div class="field"><label>保留席</label>

      ${has("signup")?`<div class="field"><label>來賓名額（全場合計）</label>

      ${has("dates")?`<div class="field"><label>活動日期</label>
        <div class="help">只辦一天就填左邊那格。活動結束隔天會自動從首頁收起來，不必記得回來刪。</div>
        <div style="display:flex;gap:9px;align-items:center">

  if(el("p_required")){
    el("p_required").onclick = e => { const b=e.target.closest(".pill"); if(!b) return;

  if(el("p_start_date")){
    const sync = () => {
      const a=el("p_start_date").value, b=el("p_deadline").value;

      if(a && b && b < a){ box.innerHTML='<span style="color:#b4261a">結束日比開始日還早</span>'; return; }
      if(a && !b){ box.textContent="單日活動"; return; }
      if(!a && b){ box.textContent="只填了結束日，也可以"; return; }
      const n = Math.round((new Date(b)-new Date(a))/864e5)+1;
      box.textContent = n===1 ? "單日活動" : `共 ${n} 天`;
    };
    el("p_start_date").oninput = sync; el("p_deadline").oninput = sync; sync();
  }
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  el("v-form").classList.add("on"); window.scrollTo(0,0);
}

async function savePost(kind, id){
  if(kind==="notice" || kind==="survey") kind = MSGKIND;   // 公告與問卷共用同一張表單
  const b=el("p_save"); b.disabled=true; b.textContent="送出中…";
  const g = f => el("p_"+f) ? el("p_"+f).value : undefined;
  const body = {id, kind, title:g("title"), body:g("body"), link:g("link"), place:g("place"),
    speaker:g("speaker"), speaker2:g("speaker2"), time_text:g("time_text"), fee:g("fee"),
    entry_time: g("entry_time") || null,
    speaker_photo:g("speaker_photo"), speaker2_photo:g("speaker2_photo"),
    speaker_body:g("speaker_body"), speaker2_body:g("speaker2_body"),
    speaker_id:g("speaker_id"), speaker2_id:g("speaker2_id"),
    photos: el("p_photos") ? JSON.parse(el("p_photos").value||"[]") : undefined, start_date:g("start_date")||null, deadline:g("deadline")||null, capacity:g("capacity"),
    reserved_seats: g("reserved"),
    guest_quota: el("p_guestquota") ? el("p_guestquota").value.trim() : undefined,
    // ⚠️ 後端是 !!b.signup_open：沒送這個欄位就會被當成 false，
    //    等於幹部每編輯一次月例會就把報名默默關掉。所以一定要送。
    signup_open: el("p_signupopen") ? el("p_signupopen").querySelector(".pill.on").dataset.s === "1" : undefined,
    waitlist_open: el("p_waitopen") ? el("p_waitopen").querySelector(".pill.on").dataset.w === "1" : undefined,
    org: el("p_org") ? el("p_org").querySelector(".pill.on").dataset.o : undefined,
    important: el("p_imp") ? el("p_imp").querySelector(".pill.on").dataset.i === "1" : undefined,
    done_count:g("done_count"), admin_link:g("admin_link"),
    visibility: el("p_vis") ? el("p_vis").querySelector(".pill.on").dataset.v : undefined,
    required: el("p_required") ? el("p_required").querySelector(".pill.on").dataset.r === "1" : false,
    // 明確寫上 +08:00：不管使用者的裝置在哪個時區，存進去的都是台灣時間
    event_at: (el("p_event_date") && el("p_event_date").value)
      ? new Date(`${el("p_event_date").value}T${(el("p_event_time") && el("p_event_time").value) || "00:00"}:00+08:00`).toISOString()
      : null};
  // 夥伴活動的三條規則在這裡才真的成立：只寫在說明文字裡沒人會照做
  if(kind==="member_event"){
    const miss = (!el("p_agree") || !el("p_agree").checked) ? "請先勾選「我已閱讀並同意以上三點」"
      : (!body.start_date && !body.deadline) ? "請填活動日期。沒有日期，系統就不知道什麼時候該把它收起來"
      : !(body.fee||"").trim() ? "請填費用。免費的活動請直接寫「免費」" : "";
    if(miss){ el("p_err").innerHTML = `<div class="err">${miss}</div>`;
      b.disabled=false; b.textContent=id?"儲存":"發布"; return; }
  }
  if(body.start_date && body.deadline && body.deadline < body.start_date){
    el("p_err").innerHTML = '<div class="err">結束日比開始日還早，請檢查一下</div>';
    b.disabled=false; b.textContent=id?"儲存":"發布"; return;
  }
  const r = await postApi(id?"update":"create", body);
  if(r.error){ el("p_err").innerHTML=`<div class="err">${esc(r.error)}</div>`;
    b.disabled=false; b.textContent=id?"儲存":"發布"; return; }
  await reloadPosts(); go("home");
}

    id, title: el("f_title").value, problem: el("f_problem").value, how: el("f_how").value,

  if(!confirm(`請問你是「${name}」嗎？\n\n確定後這個 LINE 就代表你，要更改需要請幹部解除綁定。`)) return;
  const r = await fn("claim", {member_id:id, line_name: window.__lineName || undefined});
  if(r.error){ el("claimErr").innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  await loadMe(); go("me");
}

function logout(){ localStorage.removeItem("tc8_token"); ME=null; paintMe(); go("home"); }

/* ── 啟動 ───────────────────────────────── */
async function loadMe(){
  const r = await fn("me");
  DBG("me 回傳", r);
  ME = r.status==="bound" ? r.member : null;
  paintMe();
  // 幹部看得到未公開的草稿（一般夥伴的公開查詢根本讀不到）
  if(ME && ME.role==="officer"){
    const all = await postApi("manage");
    if(all.posts) POSTS = all.posts;
    const pend = await fn("pending_list");
    PENDING = (pend.members||[]).length;
    syncNewBadges();   // 撈到才知道有幾件待辦，畫上去
  }
  return r.status;
}
(async function init(){
  DBG("啟動", {網址:location.href, 有通行證:!!token(), 有授權碼:new URLSearchParams(location.search).has("code")});
  el("v-home").innerHTML = '<div class="busy">載入中…</div>';
  try{
    [MEMBERS, TAGS, CASES] = await Promise.all([
      rest("members?select=" + MEMBER_FIELDS + "&order=sort.asc"),
      rest("tag_vocab?select=slug,label&active=is.true&order=sort.asc"),
      rest("ai_cases?select=id,member_id,title,problem,tools,how,detail,tags,term,share_level,created_at&order=created_at.desc"),
      restPosts("&order=created_at.desc"),
      rest("ai_needs?select=id,member_id,title,problem,tried,urgency,detail,tags,closed_at,helpers,created_at&order=created_at.desc"),
    ]).then(r => { POSTS = r[3]; NEEDS = r[4]; return r; });
  }
  catch(e){
    MEMBERS = []; window.__tc8err = String(e); console.error("載入夥伴失敗", e);
    // ⛔ 不能只寫進 console：使用者看到的會是滿頁「還沒有活動」「還沒有公告」，
    //    以為分會什麼都沒辦，而不是網路有問題
    el("v-home").innerHTML = `<div class="center"><div class="err">
      資料載入失敗，請下拉重新整理。<br>
      <span style="font-size:.8rem">如果一直這樣，請跟幹部說一聲。</span></div></div>`;
    return;
  }
  const jumped = await handleCallback();
  const st = await loadMe();
  // ⛔ 這五個一定要並行，不能一個 await 接一個。
  //    它們都只需要通行證（所以排在 loadMe 之後），彼此不相依、
  //    寫入的全域也完全不重疊——排成一直線只是白等，首頁會多卡好幾秒。
  await Promise.all([
    reloadSeats(),    // MY_SIGNUPS 需要通行證
    reloadReacts(),   // MY_REACTS 需要通行證才知道我按過哪些
    reloadStreak(),   // 連續缺席也要通行證
    reloadComments(), // 留言內容要通行證；則數是公開的
    reloadBuys(),
  ]);
  syncNewBadges();       // 資料到齊才算得出「有幾則新的」
  if(!jumped && st==="unbound"){ go("claim"); return; }
  if(el("v-claim").classList.contains("on")) return renderClaim();
  go("home");
})();
const _go = go;
// 多行輸入框自動長高——內容超過目前高度就自己撐開，不用在小框裡捲
function autoGrow(t){
  if(!t) return;
  t.style.height = "auto";
  t.style.height = Math.max(t.scrollHeight + 2, 280) + "px";
}
document.addEventListener("input", e => {
  if(e.target && e.target.matches && e.target.matches(".field textarea")) autoGrow(e.target);
});

go = function(v, b){ _go(v,b); if(v==="claim") renderClaim(); };

// ⛔ 不能只掛在 go()：openPost 這類函式自己操作 .view class，不經過 go。
//    改成監看表單容器的內容變動——不管是誰渲染的，有內容的欄位都會被撐開。
["v-form","v-claim","v-me"].forEach(id => {
  const box = el(id); if(!box) return;
  new MutationObserver(() => box.querySelectorAll(".field textarea").forEach(autoGrow))
    .observe(box, {childList:true});
});
</script>
