<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO TC8｜AI 案例與活動中心</title>
<meta name="theme-color" content="#15296B">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-title" content="CXO TC8">
<style>
:root{
  --blue-900:#15296B; --blue-700:#1E40A0; --blue-500:#2B57C4;
  --orange:#E76318; --orange-dark:#cf5413;
  --bg:#e8f0fa; --card:#ffffff; --text:#16181d; --muted:#5b6472;
  --line:#e2e7ef; --line-soft:#eef1f7;
  --chip:#eef2fb; --chip-text:#26418f;
  --ok:#1a7f4b; --warn:#b4531a;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  --nav-h:60px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 頂欄 ───────────────────────────── */
.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 58%,var(--blue-500) 100%);
  color:#fff; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
}
.top .logo{width:36px;height:36px;border-radius:9px;flex:none;object-fit:cover;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
.top h1{font-size:1.02rem;font-weight:800;letter-spacing:.5px;line-height:1.2}
.top .sub{font-size:.72rem;opacity:.82;font-weight:400;letter-spacing:0}
.top .me{margin-left:auto;display:flex;align-items:center;gap:7px;background:#ffffff26;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;min-height:36px}
.top .me .dot{width:7px;height:7px;border-radius:50%;background:#5fe0a0}

/* ── 版心 ───────────────────────────── */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 26px}
.view{display:none} .view.on{display:block}

/* ── 區塊標題 ───────────────────────── */
.sec{display:flex;align-items:baseline;gap:9px;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.sec h2{font-size:1.02rem;font-weight:800;letter-spacing:.3px}
.sec .more{margin-left:auto;font-size:.82rem;color:var(--blue-500);font-weight:600;min-height:44px;display:flex;align-items:center}


/* ── 卡片 ───────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:10px}

/* 月例會大卡 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hero .band{background:linear-gradient(135deg,var(--blue-900),var(--blue-500));color:#fff;padding:14px 16px}
.hero .band .kicker{font-size:.72rem;opacity:.85;letter-spacing:1.5px;font-weight:700}
.hero .band .t{font-size:1.18rem;font-weight:800;margin-top:3px;line-height:1.4}
.hero .body{padding:14px 16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.speaker{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.speaker .n{font-weight:700;font-size:.94rem}
.speaker .r{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:13px}
/* 活動詳情的報名按鈕：照文字長度給寬度就好。
   .btn 預設 flex:1 是為了首頁那排主要動作，套到這裡會變成兩顆撐滿一整列的大色塊 */
.actions.compact{flex-wrap:wrap}
.actions.compact .btn{flex:none;min-height:40px;padding:0 18px;font-size:.88rem}
.btn{flex:1;min-height:46px;border:none;border-radius:var(--r-sm);font-weight:700;font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,transform .12s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-dark)}
.btn-ghost{background:transparent;color:var(--blue-500);border:1.5px solid var(--line)}
.btn-done{background:var(--chip);color:var(--muted);cursor:default}
.btn-checkin{background:#1f7a4d;color:#fff}
.btn-checkin:hover{background:#186040}
.seatline{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:.88rem;color:var(--muted)}
.seatline b{color:var(--orange);font-weight:800;font-size:1.05rem}
.seatline.full{color:var(--orange-dark);font-weight:700}
.myorder{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:var(--r-sm);font-size:.88rem;color:var(--text)}
.myorder b{color:var(--blue-900)}
.myorder.wait{background:#fff6e5}
.myorder-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cancelbtn{flex:none;background:none;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:5px 10px;font-size:.8rem;color:var(--muted);cursor:pointer}
.cancelbtn:hover{border-color:var(--orange);color:var(--orange)}
.btn-wait{background:#e8a33d;color:#fff}
.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px;
  padding-top:11px;border-top:1px dashed var(--line)}
.adminlbl{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:1px;
  background:var(--chip);padding:3px 8px;border-radius:999px}
.adminbar button{min-height:36px;padding:0 11px;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r-sm);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.adminbar button:hover{border-color:var(--blue-500);color:var(--blue-500)}
.admincard{padding:0}
.arow{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  border-top:1px solid var(--line-soft);font-size:.94rem}
.arow:first-child{border-top:none}
.arow:hover{background:var(--chip)}
.arow>span:first-child{flex:1}
.ago{color:var(--muted);font-size:1.2rem}
/* 幹部功能跟一般分頁之間隔一條線——它們是不同性質的東西 */
/* 手機底部橫排最多放 5 個；活動／公告／團購／分會管理改從「我的」進入 */
.burger{display:grid;place-items:center;width:38px;height:38px;flex:none;margin-right:2px;
  border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;cursor:pointer}
.burger:active{background:rgba(255,255,255,.26)}
@media (min-width:1024px){ .burger{display:none} }
.card.important{border-color:#e5b4ae;box-shadow:0 1px 3px rgba(192,57,43,.13)}
.card.important .notice .t{color:#c0392b}
.notice .ic.red{background:#fde8e8;color:#c0392b}
.imptag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;
  background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;vertical-align:1px}
/* 導覽上的「有新東西」紅點 */
.nav button{position:relative}
.newdot{position:absolute;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:#c0392b;color:#fff;font-size:.66rem;font-weight:800;line-height:17px;
  text-align:center;box-shadow:0 0 0 2px var(--card)}
@media (max-width:1023px){ .newdot{top:4px;left:calc(50% + 4px)} }
@media (min-width:1024px){ .newdot{top:50%;right:16px;transform:translateY(-50%)} }
.newpill{flex:none;background:#fde8e8;color:#c0392b;font-size:.72rem;font-weight:700;
  padding:2px 8px;border-radius:999px}
.lightbox{position:fixed;inset:0;background:rgba(8,14,28,.92);z-index:80;display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.lightx{position:absolute;top:14px;right:16px;width:40px;height:40px;border:none;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer}
.spcell .ph{cursor:zoom-in}
.itemphotos img{cursor:zoom-in}
/* 會場報到的輸入框。⛔ 不能用 prompt()——LINE 內建瀏覽器（iOS WKWebView）
   沒實作 runJavaScriptTextInputPanel，prompt() 不會跳出來，直接回傳 null，
   使用者按了「報到」畫面完全沒反應（2026-08-27 查證 Apple／Android 官方規範）。
   alert()／confirm() 不受影響，所以全站其他彈窗維持原樣。 */
.cimodal{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:90;display:none;
  align-items:center;justify-content:center;padding:22px}
.cimodal.on{display:flex}
.cibox{background:var(--card);border-radius:var(--r);box-shadow:0 18px 50px rgba(8,14,28,.3);
  width:100%;max-width:360px;padding:20px}
.cibox h3{font-size:1.08rem;font-weight:800;margin-bottom:5px}
.cibox .cihint{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:13px}
.cibox input{width:100%;font-size:16px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-sm);text-align:center;letter-spacing:2px;font-weight:700;
  text-transform:uppercase;font-family:inherit}
.cibox input:focus{outline:none;border-color:var(--blue-500)}
.cimsg{font-size:.86rem;line-height:1.6;margin-top:10px;min-height:1.2em}
.cimsg.err{color:#b4261a}
.cimsg.ok{color:var(--ok);font-weight:700}
.cibtns{display:flex;gap:9px;margin-top:15px}
.cibtns .btn{flex:1}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.42);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--card);
  z-index:61;transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  box-shadow:2px 0 22px rgba(10,20,40,.18);overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom)}
.drawer.on{transform:none}
.drawerhead{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line)}
.drawerhead img{border-radius:10px}
.drawerhead b{font-size:.98rem}
.drawerhead .sub{font-size:.78rem;color:var(--muted)}
.drawerx{margin-left:auto;border:none;background:none;font-size:1.5rem;color:var(--muted);
  cursor:pointer;line-height:1;padding:0 4px}
.drawerrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:none;
  background:none;font-size:.96rem;color:var(--text);cursor:pointer;text-align:left;
  border-bottom:1px solid var(--line-soft)}
.drawerrow svg{color:var(--muted);flex:none}
.drawerrow span{flex:1}
.drawerrow .go{color:var(--line)}
.drawerrow:active{background:var(--chip)}
.drawerrow.officer{border-top:6px solid var(--bg);color:var(--blue-900);font-weight:600}
.deskonly{display:none!important}
/* 手機底部的順序跟側欄不同（首頁・公告・活動・AI案例・團購・我的），
   但清單只有一份——用 order 重排，不要複製成兩份 HTML */
@media (max-width:1023px){
  .nav button[data-v="home"]{order:1}
  .nav button[data-v="notices"]{order:2}
  .nav button[data-v="acts"]{order:3}
  .nav button[data-v="cases"]{order:4}
  .nav button[data-v="buys"]{order:5}
  .nav button[data-v="me"]{order:6}
}
@media (min-width:1024px){ .deskonly{display:flex!important} }
.navsep{display:none}
@media (min-width:1024px){
  .navsep{display:block;height:1px;background:var(--line);margin:8px 16px}
}
.backbar{display:flex;align-items:center;gap:4px}
.back2{color:var(--muted)!important}
.back2::before{content:"·";margin-right:4px;color:var(--line)}
.abadge{background:var(--orange);color:#fff;font-size:.75rem;font-weight:700;
  padding:2px 9px;border-radius:999px}
.guestbox{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm)}
.guesthead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem}
.guesthead b{color:var(--blue-900)}
.guestrow{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:.88rem}
.guestrow .cancelbtn{margin-left:5px}
.rolebadge{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:999px;
  background:var(--chip);color:var(--blue-900);font-size:.82rem;font-weight:700}
.bstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:14px}
.bstat>div{background:var(--chip);border-radius:var(--r-sm);padding:10px 6px;text-align:center}
.bstat b{display:block;font-size:1.35rem;color:var(--blue-900)}
.bstat span{font-size:.74rem;color:var(--muted)}
.bstat .warn b{color:var(--orange-dark)}
.ckrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.ckrow.done{background:#f0f9f3}
.ckrow.nosign .ckinfo b{color:var(--orange-dark)}
.ckinfo{flex:1;min-width:0;font-size:.92rem}
.cksub{font-size:.78rem;color:var(--muted);margin-top:2px}
.cksub b.far{color:#c0392b}
.ckbtn{flex:none;min-height:42px;min-width:74px;border:1.5px solid var(--line);background:var(--card);
  border-radius:var(--r-sm);font-weight:700;font-size:.88rem;cursor:pointer}
.ckbtn.on{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
.tagx{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fde8e8;color:#c0392b;font-size:.72rem;font-weight:700}
.tagw{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fff2dd;color:#a06010;font-size:.72rem;font-weight:700}
.absel{margin-top:6px;width:100%;min-height:38px;padding:0 8px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:.84rem}
.qrbox{margin-top:16px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);text-align:center}
.buycard{cursor:pointer;overflow:hidden}
.buycard:hover{box-shadow:0 3px 14px rgba(21,41,107,.14)}
.buycard.past{opacity:.62}
.mphoto{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line)}
.mgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mgal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;
  border:1px solid var(--line);cursor:pointer}
.buyimg{width:100%;height:150px;object-fit:cover;display:block}
.buybody{padding:12px 14px}
.buytitle{font-weight:700;font-size:1rem}
.buymeta{font-size:.8rem;color:var(--muted);margin-top:4px}
.buymeta b{color:var(--blue-900);font-size:.95rem}
.okmark{color:#1f7a4d;font-weight:700}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:9px 0 6px}
.barfill{height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.barfill.ok{background:#1f7a4d}
.itemcard{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.itemname{font-weight:700;font-size:1.02rem}
.itemphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.itemphotos img{width:100%;height:130px;object-fit:cover;border-radius:8px;display:block}
.itemphotos img:only-child{grid-column:span 2;height:170px}
.ordbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.myorders{margin-top:10px;padding:8px 10px;background:var(--chip);border-radius:var(--r-sm)}
.myorderrow{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:5px 0;font-size:.86rem}
.vargrp{margin-top:10px}
.vargrpname{font-size:.82rem;color:var(--muted);margin-bottom:5px}
.varmv{border:none;background:none;color:var(--blue-500);cursor:pointer;font-size:.9rem;
  line-height:1;padding:0 3px}
.varmv:hover{color:var(--blue-900)}
.varx{margin-left:6px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1}
.pill.dashed{border-style:dashed;color:var(--blue-500)}
.qtyin{min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:1rem;width:100%}
/* 規格與數量同一列並排，放不下才換行——一個一個往下堆會把訂購按鈕擠出畫面 */
.ordline{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;margin-top:10px}
.ordcell{flex:1 1 auto;min-width:0}
.ordcell>label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.ordcell.qty{flex:0 0 88px}
.creditbig{margin-top:16px;padding:22px;background:var(--chip);border-radius:var(--r);text-align:center}
.cnum{font-size:3.4rem;font-weight:800;color:var(--blue-900);line-height:1}
.cmax{font-size:1rem;color:var(--muted);margin-left:6px}
.clight{margin-top:8px;font-size:.95rem;font-weight:700}
.crow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:.88rem}
.qrhint{font-size:.86rem;color:var(--muted)}
.qrhint2{margin-top:10px;font-size:.78rem;color:var(--muted)}
.qrcode{margin-top:12px;font-family:ui-monospace,monospace;font-size:2.6rem;font-weight:800;letter-spacing:5px;color:var(--blue-900)}
.dietnote{margin-top:4px;font-size:.82rem;color:var(--muted)}
.mealopt{display:flex;flex-wrap:wrap;gap:8px}
.mealopt .pill.sold{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.mealprice{font-size:.78rem;color:var(--muted);margin-left:4px}
.mhead{display:grid;grid-template-columns:1fr 72px 72px 62px auto auto;gap:6px;font-size:.75rem;color:var(--muted);margin:6px 0 3px;padding:0 2px}
.mrow{display:grid;grid-template-columns:1fr 72px 72px 62px auto auto;gap:6px;align-items:center;margin-top:6px}
.mrow input{min-height:40px;padding:0 9px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:.9rem;width:100%}
.mrow.off input{opacity:.5;text-decoration:line-through}
.mbtn{min-height:40px;padding:0 12px;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);font-size:.85rem;font-weight:600;cursor:pointer}
.mbtn.save{background:var(--blue-500);color:#fff;border-color:var(--blue-500)}
.mbtn.add{margin-top:8px;width:100%;color:var(--blue-500);border-style:dashed}
.mnote{font-size:.75rem;color:var(--muted);white-space:nowrap}
.tally{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.tallyrow{display:flex;justify-content:space-between;padding:9px 12px;font-size:.9rem;border-top:1px solid var(--line-soft)}
.tallyrow:first-child{border-top:none}
.tallyrow b{font-size:1.05rem;color:var(--blue-900)}
.tallyrow.sum{background:var(--chip);font-weight:700}
.rosterwrap{margin-top:6px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.roster{border-collapse:collapse;width:100%;font-size:.86rem;white-space:nowrap}
.roster th,.roster td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
.roster th{background:var(--chip);font-weight:700;position:sticky;top:0}
.roster td:first-child,.roster th:first-child{color:var(--muted);text-align:right}
@media (max-width:640px){
  .mhead{display:none}
  .mrow{grid-template-columns:1fr 60px 60px 52px;grid-auto-rows:auto}
  .mrow .mbtn{grid-column:span 1}
}

a.btn{text-decoration:none}
.btn-sm{min-height:44px;font-size:.86rem;padding:0 15px;flex:none}

/* 公告 */
.notice{display:flex;gap:11px;padding:13px 15px;align-items:flex-start}
.notice .ic{width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;flex:none}
.notice .t{font-weight:700;font-size:.93rem;line-height:1.45}
.notice .d{font-size:.79rem;color:var(--muted);margin-top:2px}

/* 小活動：連結列 */
.linkrow{display:flex;align-items:center;gap:11px;padding:13px 15px;min-height:56px;border-bottom:1px solid var(--line-soft)}
.linkrow:last-child{border-bottom:none}
.linkrow .t{font-weight:600;font-size:.92rem;flex:1;min-width:0}
.linkrow .d{font-size:.78rem;color:var(--muted);margin-top:1px}
.linkrow .go{color:var(--muted);flex:none}

/* 問卷完成率 */
.survey{padding:14px 15px}
.survey .t{font-weight:700;font-size:.93rem}
.survey .d{font-size:.79rem;color:var(--muted);margin-top:2px}
.bar{height:9px;border-radius:99px;background:var(--line-soft);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-700),var(--blue-500))}
.rate{display:flex;justify-content:space-between;font-size:.79rem;color:var(--muted);margin-top:6px}
.rate b{color:var(--text);font-variant-numeric:tabular-nums}

/* ── 案例列（第一層）─────────────────── */
.caserow{display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-soft);cursor:pointer;min-height:64px;align-items:flex-start;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
.caserow:last-child{border-bottom:none}
.caserow:active{background:var(--line-soft)}
.caserow .t{font-weight:700;font-size:.97rem;line-height:1.45}
.caserow .by{font-size:.79rem;color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{background:var(--chip);color:var(--chip-text);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.free{background:transparent;color:var(--muted);border:1px solid var(--line)}
.caserow .go{color:var(--muted);flex:none;align-self:center}

/* ── 搜尋與篩選 ─────────────────────── */
.tools{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:40;background:var(--bg);padding:10px 0 8px;margin:-4px 0 6px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 12px;min-height:46px}
.search input{flex:1;border:none;outline:none;background:none;font-size:16px;min-width:0;min-height:44px}
.search .ic{color:var(--muted);flex:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-size:.82rem;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.chip.on{background:var(--blue-700);border-color:var(--blue-700);color:#fff}
.hint{font-size:.79rem;color:var(--muted);padding:2px 3px 0}

/* ── 案例詳情（第二層）──────────────── */
.back{display:flex;align-items:center;gap:7px;min-height:44px;font-weight:700;font-size:.9rem;color:var(--blue-500);margin:-2px 0 8px;background:none;border:none;cursor:pointer}

.detail{padding:17px 16px}
.detail h2{font-size:1.28rem;font-weight:800;line-height:1.4}
.author{display:flex;align-items:center;gap:10px;margin:13px 0 0;padding:12px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.block{margin-top:17px}
.block .lbl{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:1.2px;margin-bottom:5px}
.block p{font-size:.96rem;line-height:1.75}
.shot{margin-top:17px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--line-soft);display:grid;place-items:center;color:var(--muted);font-size:.82rem}
.share{margin-top:17px;background:var(--chip);border-radius:var(--r-sm);padding:13px 14px;display:flex;align-items:center;gap:11px}
.share .t{font-size:.88rem;font-weight:700;color:var(--chip-text)}
.share .d{font-size:.78rem;color:var(--muted);margin-top:1px}

/* ── 需求 ───────────────────────────── */
.needrow{padding:14px 15px;border-bottom:1px solid var(--line-soft)}
.needrow:last-child{border-bottom:none}
.needrow .t{font-weight:700;font-size:.96rem;line-height:1.45}
.needrow .by{font-size:.79rem;color:var(--muted);margin-top:3px}
.urg{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.urg.hot{background:#fdebe0;color:var(--warn)}
.urg.mid{background:var(--chip);color:var(--chip-text)}

.matchbox{margin-top:9px;background:var(--line-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:.83rem;color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.matchbox b{color:var(--text)}

/* ── 夥伴 ───────────────────────────── */
.mrow{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-soft);align-items:center}
.mrow:last-child{border-bottom:none}
.mrow .n{font-weight:700;font-size:.95rem}
.mrow .c{font-size:.79rem;color:var(--muted);margin-top:2px}
.badge{background:var(--orange);color:#fff;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.cnt{font-size:.78rem;color:var(--muted);flex:none;text-align:right;font-variant-numeric:tabular-nums}
.cnt b{display:block;font-size:1.05rem;color:var(--blue-500);font-weight:800}


/* ── 我的 ───────────────────────────── */
.mecard{padding:16px;display:flex;align-items:center;gap:13px}
.mecard .ava{width:52px;height:52px;font-size:1.1rem}
.mecard .n{font-weight:800;font-size:1.06rem}
.mecard .c{font-size:.82rem;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.79rem;color:var(--muted)}
.menu{margin-top:12px}
.menurow{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line-soft);min-height:56px;cursor:pointer}
.menurow:last-child{border-bottom:none}
.menurow .t{flex:1;font-weight:600;font-size:.94rem}
.menurow .ic{color:var(--muted);flex:none}
.officer-only{background:linear-gradient(135deg,#fff6ef,#fdeee3);border-color:#f6d5bd}


/* ── 底部導覽 ───────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
/* 側欄品牌區（只在桌面出現；手機的 logo 在頂欄）*/
.brand{display:none}
@media (min-width:1024px){
  .brand{display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:6px 16px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .brand img{width:72px;height:72px;border-radius:16px;object-fit:cover;
    box-shadow:0 2px 10px rgba(21,41,107,.22)}
  .brandname{font-size:.92rem;font-weight:800;letter-spacing:2px;color:var(--blue-900)}
}
.nav button{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:var(--nav-h);color:var(--muted);font-size:.68rem;font-weight:700;
}
.nav button.on{color:var(--blue-500)}

.nav button.on .ic{transform:translateY(-1px)}
.nav .ic{transition:transform .18s}

/* ── 桌面：改側欄 ───────────────────── */
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:212px}
  .nav{top:0;bottom:0;right:auto;width:212px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-top:20px;gap:2px;overflow-y:auto}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 20px;min-height:48px;font-size:.9rem}
  .nav button.on{background:var(--chip)}
  .top{padding-left:20px}
  .wrap{padding-top:22px}
  .tools{top:calc(54px)}
  /* ⛔ 別在空間大的地方省空間：側欄佔掉 212px 之後還有一千多 px，
     內容卻卡在 760px，右邊整片空白。桌機把內容區放寬。 */
  .wrap{max-width:1240px}
  /* 首頁只有月例會一條橫幅，不能跟活動頁一樣切兩欄——右邊會空一半 */
  .featured.solo{grid-template-columns:1fr}
  /* 但單欄拉到 1240px 寬時，16:9 會變成 700px 高的巨幅色塊，
     所以 solo 的色塊改成由內容撐高、不吃比例 */
  .featured.solo .fband{aspect-ratio:auto;min-height:190px}
}
.proto{max-width:760px;margin:0 auto;padding:0 14px 18px}
.proto .b{background:#fff8e6;border:1px solid #f0dda8;color:#6b5518;border-radius:var(--r-sm);padding:10px 13px;font-size:.8rem;line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 夥伴卡片牆（64 人固定名冊，資訊一次看完，不收起來）── */
#v-members{max-width:1280px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:15px 16px 14px;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .18s,transform .12s}
.mcard:hover{box-shadow:0 2px 6px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.10)}
.mcard:active{transform:scale(.995)}
.mhead{display:flex;gap:11px;align-items:flex-start}
.mhead .ava{width:42px;height:42px;font-size:1rem}
.mhead .n{font-weight:800;font-size:1.02rem;line-height:1.35}
.mhead .t{font-size:.8rem;color:var(--muted);margin-top:2px}
.mhead .badge{margin-left:0;margin-top:0;align-self:flex-start;flex:none}
.itag{display:inline-block;background:var(--chip);color:var(--chip-text);font-size:.72rem;font-weight:700;
  padding:3px 9px;border-radius:6px;margin-top:7px}
.mco{font-weight:700;color:var(--blue-700);font-size:.9rem;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.mdesc{font-size:.85rem;line-height:1.7;color:var(--text);margin-top:8px}
.mline{font-size:.82rem;line-height:1.65;margin-top:7px}
.mline b{color:var(--orange);font-weight:800;margin-right:4px}
.mweb{font-size:.79rem;color:var(--blue-500);margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);word-break:break-all}
.mnone{font-size:.79rem;color:var(--muted);font-style:italic;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:9px}
.filters select{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-size:.9rem;cursor:pointer}
@media (max-width:640px){ .mgrid{grid-template-columns:1fr} }

/* 活動頁置頂橫幅：月例會與 CXO 各一條。
   ⛔ 不用 auto-fill：那會在寬螢幕擠成三欄，橫幅就不是橫幅了。
   桌機固定兩欄並排、窄螢幕自動上下疊。 */
.featured{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
@media(min-width:820px){.featured{grid-template-columns:1fr 1fr}}
.fbn{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:box-shadow .18s}
.fbn:hover{box-shadow:0 2px 6px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.10)}
.fbn .fimg{aspect-ratio:16/9;min-height:0;overflow:hidden;background:var(--line-soft)}
.fbn .fimg img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
/* 還沒放圖的時候不要留一塊灰色空格——用底色橫幅撐住，之後上傳圖片就換掉 */
.fbadge{position:absolute;top:12px;right:12px;z-index:2;font-size:.72rem;font-weight:800;
  padding:5px 11px;border-radius:999px;letter-spacing:.5px;box-shadow:0 1px 4px rgba(8,14,28,.18)}
.fbadge.no{background:#fff;color:var(--blue-900)}
.fbadge.yes{background:var(--ok);color:#fff}
.fbadge.wait{background:#fff3d6;color:#8a5a12}
.fbn .fband{aspect-ratio:16/9;background:linear-gradient(135deg,var(--blue-900),var(--blue-500));
  color:#fff;display:flex;flex-direction:column;justify-content:center;padding:18px 20px}
.fbn .fband .k{font-size:.72rem;letter-spacing:1.5px;font-weight:700;opacity:.85}
.fbn .fband .t{font-size:1.3rem;font-weight:800;margin-top:6px;line-height:1.35}
.fbn .fbody{padding:13px 15px}
.fbn .fbody .t{font-weight:800;font-size:1.02rem;line-height:1.45}
/* 連續缺席的燈：要看得見才有用——淡淡的灰字等於沒做 */
/* ⛔ .card 本身沒有 padding（內距一向由裡面的元素負責，例如 .detail），
   內容裸塞進去就會整個貼齊邊緣。報名區自己帶內距。 */
.signupcard{padding:15px 16px}
.signupcard .seatline{margin-bottom:2px}
/* 點讚不做成「跟報名區一樣重的框」：它只有一顆小按鈕，
   重要性也低一階。改成一條輕量橫列，靠按鈕自己的邊框就夠。 */
.likebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 4px 12px}
/* 使用說明：一段一張卡，開頭 emoji 當圖示。
   ⛔ 內容由 md 產生（4_tc8-docs/使用說明_*.md），這裡只負責長相。 */
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px 18px;margin-bottom:12px}
.hcard > *:last-child{margin-bottom:0}
.helpdoc .hico{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;background:var(--chip);
  font-size:1.05rem;margin-right:10px;flex:none}
/* 步驟用大圓圈數字，一眼看得出「第幾步」 */
.hcard ol{list-style:none;margin:10px 0 0;counter-reset:step}
.hcard ol li{counter-increment:step;position:relative;padding-left:38px;margin:0 0 11px;line-height:1.72}
.hcard ol li::before{content:counter(step);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:50%;background:var(--blue-500);color:#fff;
  display:grid;place-items:center;font-size:.82rem;font-weight:800}
.hcard ul{list-style:none;margin:10px 0 0 2px}
.hcard ul li{position:relative;padding-left:20px;margin:0 0 8px;line-height:1.72}
.hcard ul li::before{content:"";position:absolute;left:4px;top:.68em;
  width:6px;height:6px;border-radius:50%;background:var(--blue-500)}
/* 使用說明：內容由 md 產生，這裡只負責讓它讀起來舒服 */
.helpdoc h1{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.helpdoc h2{display:flex;align-items:center;font-size:1.06rem;font-weight:800;margin:0 0 10px}
.helpdoc h3{font-size:.97rem;font-weight:800;margin:16px 0 6px;color:var(--blue-700)}
.helpdoc p{margin:8px 0;line-height:1.8}
.helpdoc ul,.helpdoc ol{margin:8px 0 8px 20px;line-height:1.8}
.helpdoc li{margin:3px 0}
.helpdoc blockquote{margin:10px 0;padding:10px 13px;background:var(--chip);border-radius:var(--r-sm);
  color:var(--muted);font-size:.9rem;line-height:1.75}
.helpdoc blockquote p{margin:0}
.helpdoc hr{border:none;border-top:1px solid var(--line);margin:20px 0}
.helpdoc code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.86rem}
.helpdoc a{color:var(--blue-700);word-break:break-all}
/* 表格在窄螢幕要自己橫向捲，不能讓整頁跟著捲 */
.helpdoc table{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.helpdoc th,.helpdoc td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.helpdoc th{background:var(--chip);font-weight:700}
.helpdoc .tablewrap{overflow-x:auto}
.stag{display:inline-block;font-size:.74rem;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:4px}
.stag.red{background:#fdecea;color:#b4261a}
.stag.amber{background:#fff4e0;color:#8a5a00}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.evcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .12s}
.evcard:hover{box-shadow:0 2px 6px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.10)}
.evcard:active{transform:scale(.995)}
/* ⛔ min-height:0 不能省：.evphoto 是 flex 子項，預設 min-height:auto 代表
   「不得小於內容」，直式照片的原始高度會整個蓋過 aspect-ratio。
   實測沒加之前是 358×477，加了才是 358×201（設了、不報錯、畫面照樣不對）。 */
.evphoto{position:relative;aspect-ratio:16/9;min-height:0;overflow:hidden;background:var(--line-soft)}
/* ⛔ object-fit:cover 預設從正中央裁，直式照片的人頭正好落在被砍的那一段。
   改成靠上緣裁——合照、人像、活動照的臉幾乎都在上半部，砍掉的是腳邊與地板。 */
.evphoto img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.evcount{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;
  font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px}
.evbody{padding:13px 15px 14px;display:flex;flex-direction:column;flex:1}
.evbody .evmeta{margin-top:auto;padding-top:8px}
.evtitle{font-weight:800;font-size:.98rem;line-height:1.45}
.obadge{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.5px;
  background:var(--chip);color:var(--chip-text);border-radius:6px;padding:2px 6px;margin-right:6px;
  vertical-align:2px}
/* 三條須知：發布前一定會看到的那一塊，用暖色跟一般欄位分開 */
.mnotice{margin-top:14px;border:1px solid #f0d9c4;background:#fff8f1;border-radius:var(--r-sm);padding:12px 14px}
.mnotice-h{font-weight:800;font-size:.9rem;color:var(--orange-dark);margin-bottom:7px}
.mnotice ol{margin:0;padding-left:19px;font-size:.83rem;line-height:1.75;color:var(--text)}
.mnotice ol li{margin-bottom:5px}
.mcheck{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.86rem;
  font-weight:700;cursor:pointer}
.mcheck input{margin-top:2px;flex:none;width:17px;height:17px}
/* 分頁上的常駐說明：離開這一頁就看不到，所以卡片上另有徽章 */
.tabnote{border:1px solid var(--line);background:var(--chip);color:var(--chip-text);
  border-radius:var(--r-sm);padding:10px 13px;font-size:.8rem;line-height:1.7;margin-bottom:12px}
/* 詳情頁底部聲明：按下報名連結前的最後一眼 */
.disclaimer{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;
  font-size:.8rem;line-height:1.75;color:var(--muted)}
.disclaimer .dh{font-weight:800;color:var(--text);font-size:.86rem;margin-bottom:6px}
.disclaimer p{margin:0 0 6px}
.maplink{color:var(--blue-700);font-weight:700;text-decoration:none;border-bottom:1px solid #c3d3f2}
.maplink:hover{border-bottom-color:var(--blue-700)}

.vpill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.4px;

.evmeta{font-size:.78rem;color:var(--muted);margin-top:8px}

.album{display:flex;flex-wrap:wrap;gap:9px}
.thumb{position:relative;width:88px;height:88px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.addphoto span{font-size:.72rem;font-weight:700}

.cover{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;flex:none;border:1px solid var(--line)}

// ⛔ posts 是逐欄授權：欄位清單裡只要有一個還沒 grant 的欄位，
//    PostgREST 會拒絕【整個查詢】（400），不是只有那一欄讀不到 → 全站貼文一起消失。
//    所以新欄位一律走這條退路：完整清單被拒就退回舊清單，畫面照常，只有新欄位是空的。
//    這讓「前端先上線、資料庫還沒套用」不再是會炸掉的組合。
const POST_FIELDS_OLD = POST_FIELDS.replace(",entry_time", "");
async function restPosts(suffix){
  try{
    return await rest("posts?select=" + POST_FIELDS + suffix);
  }catch(e){
    console.warn("posts 完整欄位查詢被拒，退回舊欄位清單（entry_time 還沒套進資料庫）", e);
    return await rest("posts?select=" + POST_FIELDS_OLD + suffix);
  }
}

async function rest(path){
  const r = await fetch(SB+"/rest/v1/"+path, {headers:{apikey:KEY, Authorization:"Bearer "+KEY}});
  if(!r.ok) throw new Error("讀取失敗 "+r.status);
  return r.json();
}

// 席次是公開數字（v_post_seats 只吐數量、不吐任何一個人）；我報名了哪幾場要驗身分才拿得到
async function reloadSeats(){
  try{
    // ⛔ 欄位沒授權時 PostgREST 是「整個查詢被拒」，不是只有那一欄讀不到。
    //    所以 guests_taken 要有退路，否則 migration 還沒套用就會讓全站席次消失。
    let rows;
    try{
      rows = await rest("v_post_seats?select=post_id,capacity,reserved_seats,taken,guests_taken");
    }catch(e){
      console.warn("v_post_seats 還沒有 guests_taken 欄位，退回舊查詢（來賓總量會顯示不出來）", e);
      rows = await rest("v_post_seats?select=post_id,capacity,reserved_seats,taken");
    }
    SEATS = Object.fromEntries(rows.map(r => [r.post_id, r]));
  }catch(e){ console.error("席次讀取失敗", e); }
  try{
    // 停用的選項讀不到（RLS 擋住），所以前台自動只看得到現行的
    MEALS = await rest("meal_options?select=id,post_id,grp,label,price,stock,sort&order=grp.asc,sort.asc");
    const t = await rest("v_meal_taken?select=option_id,taken");
    MEAL_TAKEN = Object.fromEntries(t.map(x => [x.option_id, x.taken]));
  }catch(e){ MEALS = []; MEAL_TAKEN = {}; console.error("餐點選項讀取失敗", e); }

  MY_GUESTS = [];
  if(token()){
    try{
      const g = await guestApi("mine", {});
      if(g && g.ok) MY_GUESTS = g.guests || [];
      const w = await guestApi("whoami", {});
      if(w && w.ok) MY_ROLE = w.me;
      const ck = await checkinApi("mine", {});
      if(ck && ck.ok) MY_CHECKINS = new Set((ck.checkins||[]).map(x => x.post_id));
    }catch(e){ console.error("來賓資料讀取失敗", e); }
  }
  MY_SIGNUPS = new Map();
  if(token()){
    try{
      const r = await signupApi("mine", {});
      if(r && r.ok) MY_SIGNUPS = new Map((r.signups||[]).map(x => [x.post_id, x]));
    }catch(e){ console.error("報名狀態讀取失敗", e); }
  }
}
// 這一場適用的選項＝專屬這場的 ＋ 通用預設
const mealsFor = postId => MEALS.filter(m => m.post_id === null || m.post_id === postId);
// 群組的順序＝該群組裡最小的排序值。
// 不用群組名稱排序——那會變成照筆畫排，「飲品」會跑到「餐點」前面。
const mealGroups = postId => {
  const ms = mealsFor(postId), min = {};
  ms.forEach(m => { min[m.grp] = Math.min(min[m.grp] ?? 9e9, m.sort); });
  return [...new Set(ms.map(m => m.grp))].sort((a, b) => (min[a] - min[b]) || a.localeCompare(b));
};
const soldOut = m => m.stock >= 0 && (MEAL_TAKEN[m.id] || 0) >= m.stock;
const mealLabel = id => (MEALS.find(m => m.id === Number(id)) || {}).label || "";
// 剩幾位；capacity 沒填 = 不限名額，回 null
function seatsLeft(postId){
  const s = SEATS[postId];
  if(!s || s.capacity == null) return null;
  return Math.max(0, s.capacity - (s.reserved_seats||0) - (s.taken||0));
}
// 剩餘席次那一行；沒開放報名或不限名額就不顯示
function signupBlock(p){
  if(!p.signup_open) return "";
  const left = seatsLeft(p.id), st = SEATS[p.id] || {};
  const wait = st.waiting ? `　候補 <b>${st.waiting}</b> 位` : "";
  if(left === null) return `<div class="seatline">開放報名中${wait}</div>`;
  if(left === 0) return `<div class="seatline full">名額已滿${
    p.waitlist_open ? "，可以登記候補" : ""}${wait}</div>`;
  return `<div class="seatline">還剩 <b>${left}</b> 個位子${wait}</div>`;
}
// 今天是不是這場活動的日子
// ⚠️ 一定要指定 Asia/Taipei：瀏覽器可能在別的時區，而「今天」對夥伴永遠是台灣的今天。
//    （後端也踩過同一個坑：資料庫的 current_date 走 UTC，台灣早上 8 點前會差一天）
const twDate = d => new Date(d).toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"});
function isEventDay(p){
  if(!p.event_at) return false;
  return twDate(p.event_at) === twDate(new Date());
}
// 現場報到：只在例會當天出現，平常完全不佔版面
function checkinButton(p){
  if(!p.event_at) return "";        // 連日期都還沒訂，就沒有報到這回事
  // ⛔ 非例會當天也要把這顆留著（只是按不下去）。
  //    原本是整顆不顯示，結果首頁只剩一顆孤零零的「報名」，
  //    看的人會問「報到在哪」——按鈕消失比按鈕變灰更難懂。
  if(!isEventDay(p)) return `<button class="btn btn-done" disabled>📍 報到（當天開放）</button>`;
  if(!ME) return `<button class="btn btn-checkin" onclick="go('me')">登入後報到</button>`;
  if(MY_CHECKINS.has(p.id)) return `<button class="btn btn-done" disabled>✓ 已報到</button>`;
  return `<button class="btn btn-checkin" onclick="doCheckin(${p.id})">📍 報到</button>`;
}
// 報到：先拿定位（拿不到也沒關係，GPS 只記錄不擋人），再送報到碼
// ⛔ 報到碼不能用 prompt() 收——在 LINE 內建瀏覽器它不會跳出來，直接回傳 null，
//    使用者按了「報到」畫面完全沒反應，而報到是會場上最不能失敗的一步。
//    改用頁面內的輸入框；打錯也留在原地重打，不必從頭再按一次。
let CI_POST = null;
function doCheckin(postId){
  if(MY_CHECKINS.has(postId)){ alert("你已經報到過了"); return; }
  CI_POST = postId;
  el("cicode").value = "";
  ciMsg("");
  el("cisend").disabled = false;
  el("cimodal").classList.add("on");
  el("cicode").focus();
}
function ciClose(){ el("cimodal").classList.remove("on"); CI_POST = null; }
function ciMsg(text, kind){
  const m = el("cimsg"); m.textContent = text; m.className = "cimsg" + (kind ? " " + kind : "");
}
async function sendCheckin(){
  const code = (el("cicode").value || "").trim();
  if(!code){ ciMsg("請先輸入報到碼", "err"); el("cicode").focus(); return; }
  const postId = CI_POST;
  el("cisend").disabled = true;
  ciMsg("報到中…請稍候");
  const pos = await new Promise(res => {
    if(!navigator.geolocation) return res(null);
    // ⚠️ 超時就放棄，不要讓人卡在報到台前面等定位
    navigator.geolocation.getCurrentPosition(
      p => res(p), () => res(null), {timeout: 6000, maximumAge: 60000});
  });
  const body = {post_id: postId, code: code.toUpperCase(), method: "qr"};
  if(pos){ body.lat = pos.coords.latitude; body.lng = pos.coords.longitude; body.accuracy = pos.coords.accuracy; }
  const r = await checkinApi("checkin", body);
  if(r && r.ok){
    MY_CHECKINS.add(postId); refreshCurrent();
    ciMsg(r.already ? "你已經報到過了" : "報到完成，" + r.name + "！", "ok");
    setTimeout(ciClose, 1400);
  }else{
    // 錯了就留在畫面上讓他直接改，不要關掉害他從頭再按一次
    ciMsg((r && r.message) || "報到失敗，請確認報到碼是否正確", "err");
    el("cisend").disabled = false;
    el("cicode").select();
  }
}
// 打完碼直接按 Enter 就送出（會場上多半單手操作）
el("cicode").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); sendCheckin(); }
  if(e.key === "Escape") ciClose();
});

// 報名按鈕：沒登入不給按、已報名顯示狀態、額滿停用
function signupButton(p){
  if(!ME) return `<a class="btn btn-ghost" onclick="go('me')">登入後報名</a>`;
  const hasMeals = mealGroups(p.id).length > 0;
  const mine = MY_SIGNUPS.get(p.id);
  if(mine){
    // 已經報名的人，這個位置要能「退出」而不是只顯示一顆按不動的「已報名」——
    // 狀態改看藍色橫幅右上角的徽章，按鈕留給真正能做的動作。
    // 改餐點不會再佔一個新位子（後端有處理）。
    return `<button class="btn btn-ghost" onclick="doCancel(${p.id})">取消報名</button>` +
      (hasMeals ? `<button class="btn btn-ghost" onclick="openSignup(${p.id})">改餐點</button>` : "");
  }
  const left = seatsLeft(p.id);
  if(left === 0){
    return p.waitlist_open
      ? `<button class="btn btn-wait" onclick="${hasMeals?`openSignup(${p.id})`:`doSignup(${p.id}, this)`}">登記候補</button>`
      : `<button class="btn btn-done" disabled>名額已滿</button>`;
  }
  return hasMeals
    ? `<button class="btn btn-primary" onclick="openSignup(${p.id})">我要報名</button>`
    : `<button class="btn btn-primary" onclick="doSignup(${p.id}, this)">我要報名</button>`;
}
// 已報名的人看得到自己訂了什麼——報到當天也是看這一行
function myOrderLine(p){
  const mine = MY_SIGNUPS.get(p.id);
  if(!mine) return "";
  const c = mine.meal_choices || {};

      <span>${waiting ? "🕐 你在候補名單上，有人取消就會自動遞補給你" : "✓ 你已報名"}${

    ${mine.diet_note ? `<div class="dietnote">備註：${esc(mine.diet_note)}</div>` : ""}</div>`;
}
// ⚠️ 截止之後也能取消——總務需要知道誰不來了。
//    而且回報要跟實際一致：不可以出現「成功取消 0 筆」這種話。
async function doCancel(postId){
  const p = POSTS.find(x => x.id === postId);
  if(!confirm(`確定要取消「${p ? p.title : ""}」的報名嗎？\n\n如果已經訂了餐，請盡早取消，
餐點是提前訂的，太晚說會造成浪費。`)) return;
  const r = await signupApi("cancel", {post_id: postId});
  await reloadSeats(); refreshCurrent();
  if(r && r.ok){
    alert(r.already ? "你先前已經取消過了" : "已取消報名"
      + (r.promoted_member_id ? "，你的位子已經自動遞補給候補的夥伴" : ""));
  }else{
    alert((r && r.message) || "取消失敗，請再試一次");
  }
}

// ── 活動分頁：TC8／CXO／夥伴 三層，各自照月份分組 ──────────
// 首頁只放最近的幾則；全部的歷史在這裡，照月份收起來，一年後也不會變成長河。
let ACT_TAB = "all";
const ORG_TABS = [
  ["all",    "全部"],
  ["tc8",    "TC8"],
  ["cxo",    "CXO"],
  ["member", "夥伴的活動"],
];
// 夥伴活動結束隔天就收起來——表單上向夥伴承諾過這件事，之前只寫了沒做。
// ⛔ 用台灣日期字串直接比大小，不要 new Date()：時區會把「今天」算成過期。
// 只收夥伴活動，TC8／CXO 的官方活動照舊留著（那是分會自己的紀錄）。
const twToday = () => new Date().toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"});
const isOverMemberEvent = p => p.kind === "member_event"
  && !!(p.deadline || p.start_date) && (p.deadline || p.start_date) < twToday();

function actsOf(tab){
  const isAct = p => (p.kind === "monthly" || p.kind === "event" || p.kind === "member_event")
    && !isOverMemberEvent(p);
  if(tab === "all")    return POSTS.filter(isAct);
  if(tab === "member") return POSTS.filter(p => p.kind === "member_event" && !isOverMemberEvent(p));
  if(tab === "tc8")    return POSTS.filter(p => p.kind === "monthly" || (p.kind === "event" && p.org === "tc8"));
  return POSTS.filter(p => p.kind === "event" && p.org !== "tc8");
}
// 用活動日期分月；沒有活動日期就用發布日期
const monthKey = p => {
  const d = p.event_at || p.start_date || p.created_at;
  return d ? new Date(d).toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"}).slice(0,7) : "0000-00";
};
const monthLabel = k => k === "0000-00" ? "沒有日期"
  : `${k.slice(0,4)} 年 ${Number(k.slice(5,7))} 月`;

function groupByMonth(list){
  const g = {};
  list.forEach(p => { (g[monthKey(p)] ??= []).push(p); });
  // 新的月份排前面；同一個月內也是新的在前
  return Object.entries(g).sort((a,b) => b[0].localeCompare(a[0]))
    .map(([k, v]) => [k, v.sort((x,y) => String(monthKey(y)+ (y.event_at||"")).localeCompare(String(monthKey(x)+(x.event_at||""))))]);
}
// 幹部有兩種活動可以發，展開讓他選；一般夥伴只有一種，直接開表單不要多一層
function toggleAddAct(){
  if(!isOfficer()){ openPost("member_event"); return; }
  const m = el("addactmenu"); if(!m) return;
  // ⛔ 用 style.display 不用 hidden 屬性：[hidden] 優先度最低，會被別的規則蓋掉
  m.style.display = getComputedStyle(m).display === "none" ? "block" : "none";
}

      <div class="arow" onclick="openPost('event')"><span>🏛️ 發布分會活動</span><span class="ago">›</span></div>
    </div>` : ""}
    <div class="tools"><div class="chips" id="acttabs">
      ${ORG_TABS.map(([k, label]) => `<button class="chip${ACT_TAB===k?" on":""}"
        onclick="ACT_TAB='${k}';renderActs()">${label} ${actsOf(k).length}</button>`).join("")}
    </div></div>
    ${ACT_TAB === "member" ? `<div class="tabnote">這一頁的活動由<b>夥伴自行主辦</b>，TC8 僅提供張貼平台。
      涉及費用請自行向主辦人確認；日後如有糾紛，請自行協商或循法律途徑處理。</div>` : ""}
    ${top.length ? `<div class="featured">${top.map(featuredBanner).join("")}</div>` : ""}
    ${groups.length ? groups.map(([k, ps]) => `
      <div class="monthsec${k === twNow ? " now" : ""}">

          <span class="mnote">${ps.length} 則</span></div>

      </div>`).join("")
      : `<div class="card"><div class="empty">${
          ACT_TAB === "all" ? "還沒有任何活動" : "這一類還沒有活動"}</div></div>`}`;
}

          const n = os.reduce((a,o) => a + o.qty, 0);
          return `<div class="arow" onclick="openBuy(${bid})">
            <span>${esc(b ? b.title : "（已移除）")}</span>

function buyRow(b){
  const items = BUY_ITEMS[b.id] || [];
  const totQty = items.reduce((a,i) => a + ((BUY_PROG[i.id]||{}).qty || 0), 0);
  const reached = items.filter(i => ((BUY_PROG[i.id]||{}).qty || 0) >= i.min_qty).length;
  const my = MY_ORDERS.filter(o => o.buy_id === b.id).reduce((a,o) => a + o.qty, 0);
  const days = daysLeft(b.deadline);
  const cover = items.find(i => (i.photos||[]).length);
  const prices = items.map(i => i.unit_price).filter(x => x > 0);
  const dead = b.status !== "open";
  return `<div class="card buycard${dead ? " past" : ""}" onclick="openBuy(${b.id})">
    ${cover ? `<img class="buyimg" src="${esc(cover.photos[0])}" alt="">` : ""}
    <div class="buybody">
      <div class="buytitle">${esc(b.title)}</div>
      <div class="buymeta">${esc(memberName(b.owner_id))}　｜　${items.length} 樣商品${
        prices.length ? `　｜　$${Math.min(...prices)}${
          Math.max(...prices) !== Math.min(...prices) ? `～$${Math.max(...prices)}` : ""}` : ""}　｜　${
        b.status === "closed" ? "已成團" : b.status === "cancelled" ? "未達門檻" :
        days < 0 ? "已截止" : days === 0 ? "今天截止" : `剩 ${days} 天`}</div>
      <div class="buymeta">累積 <b>${totQty}</b> 件${
        reached ? `　<span class="okmark">✓ ${reached} 樣已成團</span>` : ""}${
        my ? `　｜　我訂了 <b>${my}</b> 件` : ""}</div>
      ${ME && (b.owner_id === ME.id || isOfficer()) ? `<div class="actions" style="margin-top:10px">
        <button class="mbtn" onclick="event.stopPropagation();openBuyForm(${b.id})">✏️ 改內容</button>
        <button class="mbtn" onclick="event.stopPropagation();openBuyDetail(${b.id}, '')">📋 訂購名單</button>
        ${isOfficer() ? `<button class="mbtn" style="color:#b4261a;border-color:#e8b4ae"
          onclick="event.stopPropagation();removeBuy(${b.id}, '${escAttr(b.title||"")}')">🗑 刪掉</button>` : ""}
      </div>` : ""}
    </div></div>`;
}

// 獨立於月例會：有商品規格與金額，跟「席次」是不同的東西。
function buyBlock(){
  const live = BUYS.filter(b => b.status === "open");
  let h = `<div class="sec"><h2>夥伴團購</h2>${
    live.length ? `<span class="more" onclick="go('buys')">全部 ${live.length}</span>` : ""}</div>`;
  if(!live.length) return h + `<div class="card"><div class="empty">目前沒有進行中的團購${
    ME ? `<br><span style="font-size:.82rem">到左邊的<b onclick="go('buys')" style="color:var(--blue-500);cursor:pointer">團購</b>就能開團</span>` : ""}</div></div>`;
  h += live.slice(0,3).map(buyRow).join("");

}
const daysLeft = d => {
  if(!d) return 0;
  const tw = x => new Date(x).toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"});
  return Math.round((new Date(d + "T00:00:00+08:00") - new Date(tw(new Date()) + "T00:00:00+08:00")) / 86400000);
};

// ── 訂購畫面：一樣商品一張卡，各自選規格與數量 ──────────
function openBuy(buyId){

          <div class="itemname">${esc(it.name)}</div>

          ${canOrder ? `<div id="ord_${it.id}" class="ordbox">
            <div class="ordline">
              ${grps.map(g => `<div class="ordcell">

              <div class="ordcell qty">

let ORD_PICK = {};   // itemId → {群組: 選項}
let ORD_EDIT = {};   // itemId → 正在改的那一筆 order id
function pickVar(itemId, grp, label, btn){
  (ORD_PICK[itemId] ??= {})[grp] = label;
  btn.parentElement.querySelectorAll(".pill").forEach(x => x.classList.remove("on"));
  btn.classList.add("on");
}
function editOrder(itemId, orderId){
  const o = MY_ORDERS.find(x => x.id === orderId); if(!o) return;
  ORD_EDIT[itemId] = orderId;
  ORD_PICK[itemId] = Object.assign({}, o.choices || {});
  const q = el("q_" + itemId); if(q) q.value = o.qty;
  // 把原本的選擇亮起來
  Object.entries(o.choices || {}).forEach(([g, v]) => {
    const box = document.getElementById(`v_${itemId}_${g}`); if(!box) return;
    box.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.textContent.trim() === v));
  });
  const box = el("ord_" + itemId); if(box) box.scrollIntoView({behavior:"smooth", block:"center"});
}
async function addOrder(itemId, btn){
  const vars = BUY_VARS[itemId] || [];
  const grps = [...new Set(vars.map(v => v.grp))];
  const pick = ORD_PICK[itemId] || {};
  const missing = grps.filter(g => !pick[g]);
  if(missing.length){ alert("還沒選：" + missing.join("、")); return; }
  const qty = Number(el("q_" + itemId).value) || 0;
  if(qty <= 0){ alert("數量要大於 0"); return; }
  btn.disabled = true; btn.textContent = "送出中…";
  const r = await buyApi("order", {
    item_id: itemId, qty, choices: grps.length ? pick : undefined,
    order_id: ORD_EDIT[itemId] || undefined,
  });
  btn.disabled = false;
  if(!r || !r.ok){ alert((r && r.message) || "訂購失敗"); return; }
  delete ORD_EDIT[itemId]; delete ORD_PICK[itemId];
  const buyId = (BUYS.find(b => (BUY_ITEMS[b.id]||[]).some(i => i.id === itemId)) || {}).id;
  await reloadBuys(); openBuy(buyId);
}
async function removeOrder(orderId){
  const o = MY_ORDERS.find(x => x.id === orderId); if(!o) return;
  if(!confirm("確定要取消這一筆訂購嗎？")) return;
  const r = await buyApi("order", {item_id: o.item_id, order_id: orderId, qty: 0});
  if(!r || !r.ok){ alert((r && r.message) || "失敗"); return; }
  const buyId = o.buy_id;
  await reloadBuys(); openBuy(buyId);
}

async function removeBuy(buyId, title){
  // ⛔ 刪除是不可逆的，先把要刪的東西講清楚
  if(!confirm(`確定要刪掉「${title}」這個團購嗎？\n\n底下的商品、規格也會一起消失，而且救不回來。`)) return;
  let r = await buyApi("remove", {id: buyId});
  // 有人訂購過：把會連帶消失的東西攤開，再問第二次
  if(r && r.error === "HAS_ORDER"){
    const detail = `${r.message}\n\n刪掉會一併消失：\n` +
      `・${r.orders} 筆訂購（${r.buyers} 個人）\n` +
      (r.payments ? `・${r.payments} 筆收款紀錄，合計 $${r.paid_total}\n` : "") +
      `\n訂購的人不會收到任何通知，他們只會發現東西不見了。\n` +
      `如果只是要停掉這一團，請按取消、改用「退回」或讓它到期。\n\n真的要連訂購紀錄一起刪掉嗎？`;
    if(!confirm(detail)) return;
    r = await buyApi("remove", {id: buyId, force: true});
  }
  if(!r || !r.ok){ alert((r && r.message) || "刪除失敗"); return; }
  await reloadBuys();
  alert(`已刪掉「${r.deleted}」`);
  go("buys"); renderBuys();
}

async function submitBuy(buyId, btn){
  btn.disabled = true; btn.textContent = "送出中…";
  const r = await buyApi("submit", {id: buyId});
  if(!r || !r.ok){
    btn.disabled = false; btn.textContent = "送出給幹部審核";
    alert((r && r.message) || "送出失敗"); return;
  }
  await reloadBuys();
  alert("已送出，等幹部核可");
  go("buys"); renderBuys();
}

async function saveBuy(buyId, btn){
  const title = el("gb_title").value.trim(), deadline = el("gb_deadline").value;
  if(!title){ alert("請填團購名稱"); return; }
  if(!deadline){ alert("請填截止日"); return; }
  btn.disabled = true; btn.textContent = "送出中…";
  const r = await buyApi(buyId ? "update" : "create", {
    id: buyId || undefined, title, body: el("gb_body").value, deadline,
  });
  btn.disabled = false;
  if(!r || !r.ok){ alert((r && r.message) || "失敗"); return; }
  await reloadBuys();
  if(buyId){ alert("已更新"); openBuyForm(buyId); }
  else { alert("建好了！接下來加商品。加完再自己送出給幹部審核。"); openBuyForm(r.id); }
}

let ITEM_PHOTOS = [];
function openItemForm(buyId, itemId){
  const it = itemId ? (BUY_ITEMS[buyId]||[]).find(x => x.id === itemId) : null;
  ITEM_PHOTOS = it ? (it.photos || []).slice(0, 2) : [];
  const vars = itemId ? (BUY_VARS[itemId] || []) : [];
  const grps = [...new Set(vars.map(x => x.grp))];
  el("v-form").innerHTML = `${backTo(`openBuyForm(${buyId})`)}
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">${it ? "改商品" : "加一樣商品"}</div>
      <div class="field" style="margin-top:16px"><label>商品名稱 *</label>
        <input type="text" id="it_name" maxlength="80" value="${it ? esc(it.name) : ""}"></div>
      <div class="field"><label>商品說明</label>
        <div class="help">材質、尺寸對照表、注意事項</div>
        <textarea id="it_body" maxlength="1000">${it ? esc(it.body || "") : ""}</textarea></div>
      <div class="field"><label>每件價格</label>
        <input type="number" id="it_price" min="0" value="${it ? it.unit_price : 0}"></div>
      <div class="field"><label>數量下限（這一樣的成團門檻）*</label>
        <div class="help">累積到這個數量你才願意製作。截止時沒達到，系統會通知訂購的人</div>
        <input type="number" id="it_min" min="1" value="${it ? it.min_qty : 10}"></div>

      <div class="field"><label>照片（最多 2 張）</label>
        <div id="it_photos" class="album"></div></div>

      <div class="field" style="margin-top:18px"><label>規格（沒有就留空）</label>
        <div class="help">左邊填類別、右邊填選項，選項用<b>逗號或頓號</b>隔開。<br>
          訂購的人每一組都要選一個。順序就是這裡填的順序。</div>
        <div id="spec_rows"></div>
        <button type="button" class="mbtn add" onclick="addSpecRow()">＋ 再加一組</button>
      </div>

      <div class="formbar">
        <button class="btn btn-primary" onclick="saveItem(${buyId}, ${itemId || "null"}, this)">${it ? "存起來" : "新增"}</button>
        ${it ? `<button class="btn btn-ghost" onclick="removeItem(${buyId}, ${it.id})">刪掉這樣商品</button>` : ""}
      </div>
    </div>`;
  SPEC_ROWS = grps.map(g => ({
    grp: g,
    labels: vars.filter(x => x.grp === g).sort((a2,b2) => a2.sort - b2.sort).map(x => x.label).join("、"),
  }));
  if(!SPEC_ROWS.length) SPEC_ROWS = [{grp:"", labels:""}];
  go("form");
  renderItemPhotos();
  renderSpecRows();
}
// 規格一次全部攤開：三列空白 + 既有的，使用者一眼看得完該填什麼
let SPEC_ROWS = [];
function renderSpecRows(){
  const box = el("spec_rows"); if(!box) return;
  box.innerHTML = SPEC_ROWS.map((r, i) => `<div class="mrow" style="margin-top:8px">
      <input type="text" placeholder="類別（顏色）" maxlength="20" value="${esc(r.grp)}"
        oninput="SPEC_ROWS[${i}].grp=this.value" style="flex:0 0 34%">
      <input type="text" placeholder="選項（紅、藍、黑）" maxlength="300" value="${esc(r.labels)}"
        oninput="SPEC_ROWS[${i}].labels=this.value">
      <button type="button" class="mbtn" onclick="rmSpecRow(${i})">×</button>
    </div>`).join("");
}
function addSpecRow(){ SPEC_ROWS.push({grp:"", labels:""}); renderSpecRows(); }
function rmSpecRow(i){ SPEC_ROWS.splice(i,1); if(!SPEC_ROWS.length) SPEC_ROWS.push({grp:"",labels:""}); renderSpecRows(); }
// 逗號、頓號、全形逗號都收；空白與重複自動去掉
function collectSpecs(){
  return SPEC_ROWS.map(r => ({
    grp: (r.grp||"").trim(),
    labels: [...new Set((r.labels||"").split(/[,，、\n]/).map(x => x.trim()).filter(Boolean))],
  })).filter(x => x.grp && x.labels.length);
}

function renderItemPhotos(){
  const box = el("it_photos"); if(!box) return;
  box.innerHTML = ITEM_PHOTOS.map((u,i) => `<div class="thumb"><img src="${esc(u)}" alt="">
      <button type="button" class="thumbx" onclick="rmItemPhoto(${i})">×</button></div>`).join("")
    + (ITEM_PHOTOS.length < 2
       ? `<button type="button" class="addphoto" onclick="addItemPhoto()">＋<span>加照片</span><small>${ITEM_PHOTOS.length}/2</small></button>`
       : `<div class="addphoto" style="opacity:.5;cursor:default"><small>已達 2 張</small></div>`);
}
function addItemPhoto(){
  pickPhoto("event", st => {
    if(st.loading) return;
    if(st.error){ alert(st.error); return; }
    ITEM_PHOTOS.push(st.url); ITEM_PHOTOS = ITEM_PHOTOS.slice(0,2); renderItemPhotos();
  }, 1200);
}
function rmItemPhoto(i){ ITEM_PHOTOS.splice(i,1); renderItemPhotos(); }

async function saveItem(buyId, itemId, btn){
  const name = el("it_name").value.trim();
  if(!name){ alert("請填商品名稱"); return; }
  btn.disabled = true; btn.textContent = "儲存中…";
  const r = await buyApi("item_save", {
    id: itemId || undefined, buy_id: buyId, name,
    body: el("it_body").value,
    unit_price: Number(el("it_price").value) || 0,
    min_qty: Number(el("it_min").value) || 1,
    photos: ITEM_PHOTOS,
    specs: collectSpecs(),
    sort: itemId ? undefined : ((BUY_ITEMS[buyId]||[]).length + 1) * 10,
  });
  btn.disabled = false;
  if(!r || !r.ok){ alert((r && r.message) || "失敗"); return; }
  await reloadBuys();
  openBuyForm(buyId);   // 規格已經一起存好了，直接回到這張單看結果
}
async function removeItem(buyId, itemId){
  if(!confirm("確定要刪掉這樣商品嗎？已經訂購的紀錄也會一起消失。")) return;
  const r = await buyApi("item_save", {id: itemId, buy_id: buyId, name: "已刪除", active: false});
  if(!r || !r.ok){ alert("失敗"); return; }
  await reloadBuys(); openBuyForm(buyId);
}
// ⚠️ 團購詳情／改團購／訂購名單／改商品 全都住在同一個 v-form 容器裡，
//    backBar() 靠「現在哪個 .view 是 on」判斷上一頁，認不出來就會退回更早的畫面。
//    這幾頁一律自己指定回哪裡。
function backTo(js, label){
  return `<div class="backbar">
    <button class="back" onclick="${js}"><svg width="17" height="17"><use href="#i-back"/></svg>${label || "回上一頁"}</button>
    <button class="back back2" onclick="go('home')">回首頁</button></div>`;
}

// 收款對帳：錢統一交給財務長，所以按「人」收、按「人」勾
function payBlock(r){
  const ppl = r.people || [];
  if(!ppl.length) return "";
  const canMark = !!r.can_mark;
  return `<div class="itemcard">
    <div class="itemname">收款對帳</div>
    <div class="tally" style="margin-top:8px">
      <div class="tallyrow"><span>已收</span><b>$${r.paid_total}</b></div>
      <div class="tallyrow"><span>未收</span><b style="color:var(--orange-dark)">$${r.unpaid_total}</b></div>
      <div class="tallyrow sum"><span>應收總額</span><b>$${r.grand_amount}</b></div>
    </div>
    ${canMark
      ? `<div class="mnote" style="margin-top:8px">錢統一交給財務長，在這裡登記。系統會記錄是誰勾的。</div>`
      : `<div class="mnote" style="margin-top:8px">繳費一律由幹部登記，開單的人只看得到收了沒</div>`}
    <div class="rosterwrap" style="margin-top:10px"><table class="roster">
      <thead><tr><th>#</th><th>姓名</th><th>件數</th><th>應付</th><th>收款</th></tr></thead>
      <tbody>${ppl.map((x,i) => `<tr>
        <td>${i+1}</td>
        <td>${esc(x.name)}</td>
        <td>${x.qty}</td>
        <td>$${x.amount}${x.mismatch ? `<span class="tagx">勾選時是 $${x.paid_amount}</span>` : ""}</td>
        <td>${x.paid
          ? `<span class="okmark">✓ 已收</span>${canMark
              ? `<button class="mbtn" style="margin-left:6px" onclick="togglePay(${r.buy.id},${x.member_id},true)">取消</button>` : ""}
             <div class="mnote" style="margin-top:3px">${esc(x.paid_by || "")} ${payTime(x.paid_at)} 收</div>`
          : (canMark
              ? `<button class="mbtn add" onclick="togglePay(${r.buy.id},${x.member_id},false)">標記已收</button>`
              : `<span class="tagw">未收</span>`)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${ledgerBlock(r.ledger)}
  </div>`;
}

// 台北時間的「月/日 時:分」——⛔ 不讓瀏覽器用裝置時區猜
function payTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("zh-TW", {timeZone:"Asia/Taipei", month:"numeric", day:"numeric",
                                    hour:"2-digit", minute:"2-digit", hour12:false});
}

// 流水帳：每一次收款與取消都留一筆，只增不改。對帳吵起來看這裡。
function ledgerBlock(ledger){
  if(!ledger || !ledger.length) return "";
  return `<div style="margin-top:16px">
    <div class="itemname">收款流水帳　<span class="mnote">${ledger.length} 筆</span></div>
    <div class="mnote" style="margin-top:4px">每一次收款與取消都會留下紀錄，不會被覆蓋。</div>
    <div class="rosterwrap" style="margin-top:8px"><table class="roster">
      <thead><tr><th>#</th><th>時間</th><th>對象</th><th>動作</th><th>金額</th><th>經手</th></tr></thead>
      <tbody>${ledger.map((x,i) => `<tr>
        <td>${i+1}</td>
        <td>${payTime(x.at)}</td>
        <td>${esc(x.name)}</td>
        <td>${x.action === "paid" ? `<span class="okmark">收款</span>` : `<span class="tagx">取消</span>`}</td>
        <td>${x.action === "paid" ? "" : "－"}$${x.amount}</td>
        <td>${esc(x.by)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

let BUY_DETAIL = null;   // 目前開著的那張訂購名單，勾收款時要回查姓名

// 把收款對帳掛到指定的容器（編輯表單頁用）。沒權限就靜靜不顯示，不跳錯誤。
async function loadPayInto(elId, buyId){
  const box = el(elId); if(!box) return;
  const r = await buyApi("detail", {buy_id: buyId});
  if(!r || !r.ok){ box.innerHTML = ""; return; }
  BUY_DETAIL = r;
  box.innerHTML = payBlock(r);
}

async function togglePay(buyId, memberId, paid){
  // ⛔ 姓名不塞進 onclick 字串：esc() 不轉單引號，名字裡有 ' 就會把整個屬性打斷
  const who = ((BUY_DETAIL && BUY_DETAIL.people) || []).find(x => x.member_id === memberId);
  const name = who ? who.name : "這位夥伴";
  // 取消已收是會抹掉紀錄的動作，先問一句；標記已收則直接做，不擋人
  if(paid && !confirm(`確定要取消「${name}」的已收款紀錄嗎？`)) return;
  const r = await buyApi("pay", {buy_id: buyId, member_id: memberId, paid: !paid});
  if(!r || !r.ok){ alert((r && r.message) || "操作失敗"); return; }
  // 收款區塊三個地方都會出現，勾完要回到「原本那一頁」重畫，不能一律跳去訂購名單
  if(el("gb_pay")) await loadPayInto("gb_pay", buyId);
  else await openBuyDetail(buyId);
}

let BUY_DETAIL_FROM = null;   // "overview" = 從幹部後台「所有團購」進來的
async function openBuyDetail(buyId, from){
  const r = await buyApi("detail", {buy_id: buyId});
  if(!r || !r.ok){ alert((r && r.message) || "讀取失敗"); return; }
  BUY_DETAIL = r;
  if(from !== undefined) BUY_DETAIL_FROM = from;
  const bar = BUY_DETAIL_FROM === "overview"
    ? backTo("openBuyOverview()", "回所有團購")
    : backTo(`openBuy(${buyId})`);
  el("v-form").innerHTML = `${bar}
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">訂購名單　${esc(r.buy.title)}</div>
      <div class="buymeta" style="margin-top:6px">截止 ${esc(r.buy.deadline)}　｜　
        全部總金額 <b>$${r.grand_amount}</b></div>
      ${payBlock(r)}
      ${r.items.map(it => `
        <div class="itemcard">
          <div class="itemname">${esc(it.name)}${it.reached ? `　<span class="okmark">✓ 已成團</span>` : ""}</div>
          <div class="buymeta">${it.qty} / ${it.min_qty} 件　｜　$${it.unit_price} × ${it.qty} = <b>$${it.amount}</b></div>
          ${Object.keys(it.tally).length ? `<div class="tally" style="margin-top:8px">
            ${Object.entries(it.tally).sort((a,b2) => b2[1]-a[1]).map(([k,v]) =>
              `<div class="tallyrow"><span>${esc(k)}</span><b>${v}</b></div>`).join("")}
            <div class="tallyrow sum"><span>小計</span><b>${it.qty}</b></div>
          </div>` : `<div class="mnote" style="margin-top:6px">還沒有人訂</div>`}
          ${it.list.length ? `<div class="rosterwrap" style="margin-top:10px"><table class="roster">
            <thead><tr><th>#</th><th>姓名</th><th>規格</th><th>數量</th><th>備註</th></tr></thead>
            <tbody>${it.list.map((x,i2) => `<tr><td>${i2+1}</td><td>${esc(x.name)}</td>
              <td>${esc(x.spec||"—")}</td><td>${x.qty}</td><td>${esc(x.note)}</td></tr>`).join("")}</tbody>
          </table></div>` : ""}
        </div>`).join("")}
    </div>`;
  go("form");
}

// 幹部總覽：一頁看完每一團、每一樣商品訂到幾件，點商品就進去看是誰訂的
// 講者本人（或幹部）看得到的入口：更新自己的講題與照片
function myTalkBtn(p){
  if(!ME || !p) return "";
  const slot = p.speaker_id === ME.id ? 1 : (p.speaker2_id === ME.id ? 2 : null);
  if(!slot && !isOfficer()) return "";
  if(!slot) return "";   // 幹部走「編輯這場」那條路，這裡只給講者本人
  return `<div class="actions" style="margin-top:12px">
    <button class="btn btn-primary" onclick="openTalkForm(${p.id},${slot})">✏️ 更新我的講題與照片</button></div>`;
}

function openTalkForm(postId, slot){
  const p = POSTS.find(x => x.id === postId); if(!p) return;
  const name = slot === 1 ? p.speaker : p.speaker2;
  const photo = (slot === 1 ? p.speaker_photo : p.speaker2_photo) || "";
  const body = (slot === 1 ? p.speaker_body : p.speaker2_body) || "";
  el("v-form").innerHTML = `${backTo("go('home')", "回首頁")}
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">更新我的講題</div>
      <div style="color:var(--muted);font-size:.85rem;margin-top:6px;line-height:1.7">
        ${esc(p.title)}　｜　${esc(name || "")}<br>
        改好之後，首頁的月例會卡片與活動詳情頁馬上就會換成新的。</div>
      <div class="field" style="margin-top:16px"><label>講題與內容簡介</label>
        <div class="help">這次要講什麼、聽完能帶走什麼。可以分行</div>
        <textarea id="tk_body" rows="6" maxlength="2000">${esc(body)}</textarea></div>
      ${photoField("tk_photo", "我的照片", photo)}
      <div class="formbar">
        <button class="btn btn-primary" onclick="saveTalk(${postId},${slot},this)">存起來</button>
      </div>
    </div>`;
  go("form");
}
async function saveTalk(postId, slot, btn){
  btn.disabled = true; btn.textContent = "儲存中…";
  const r = await postApi("speaker_update", {id: postId, slot,
    body: el("tk_body").value, photo: el("tk_photo") ? el("tk_photo").value : ""});
  btn.disabled = false; btn.textContent = "存起來";
  if(r.error){ alert(r.error); return; }
  await reloadPosts();
  alert("更新好了，首頁已經換成新的內容");
  go(FORM_FROM); refreshCurrent();
}

// 幹部：一張清單看完所有夥伴，綁定／退出／刪除都在這裡做
let MADMIN = null, MADMIN_TAB = "all";
async function openMemberAdmin(tab){
  if(!isOfficer()) return;
  if(tab) MADMIN_TAB = tab;
  if(!MADMIN){
    el("v-form").innerHTML = `${backBar()}<div class="form"><div class="busy">載入中…</div></div>`;
    go("form");
  }
  const r = await fn("member_admin");
  if(r.error){ el("v-form").innerHTML = `${backBar()}<div class="form"><div class="err">${esc(r.error)}</div></div>`; return; }
  MADMIN = r;
  const F = {
    pending:  m => m.status === "pending",
    all:      m => m.status === null,
    unbound:  m => m.status === null && !m.bound_at,
    bound:    m => m.status === null && m.bound_at,
    // ⛔ pending 是待審申請不是已退出，兩者的 status 都不是 null
    retired:  m => m.status !== null && m.status !== "pending",
  };
  const list = (r.list || []).filter(F[MADMIN_TAB] || F.all);
  const TABS = [["pending","🔔 待審核",r.stats.pending],["all","全部現任",r.stats.total],
                ["unbound","還沒綁",r.stats.unbound],["bound","已綁定",r.stats.bound],
                ["retired","已退出",r.stats.retired]];
  el("v-form").innerHTML = `${backBar()}
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">夥伴管理</div>
      <div class="mnote" style="margin-top:6px">
        綁定、退出、刪除都在這裡做。<b>解除綁定</b>＝他下次開 App 重選一次；
        <b>退出</b>＝名冊上消失但內容留著；<b>刪除</b>＝只有完全沒內容的重複帳號刪得掉。</div>
      <div class="tools" style="margin-top:12px"><div class="chips">
        ${TABS.map(([k,label,n]) => `<button class="chip${MADMIN_TAB===k?" on":""}"
          onclick="openMemberAdmin('${k}')">${label} ${n}</button>`).join("")}
      </div></div>
      <div class="card admincard" style="margin-top:10px">${list.length ? list.map(m => `
        <div class="arow" style="align-items:center;gap:10px">
          <span style="flex:1;min-width:0">
            <b>${esc(m.name)}</b>${m.officer?`<span class="badge">${esc(cleanTitle(m.officer))}</span>`:""}${streakTag(m.id)}
            <div class="mnote" style="margin-top:2px">
              ${esc([m.company,m.title].filter(Boolean).join(" ・ ")) || "資料待補"}${
              m.line_name ? `　｜　LINE：${esc(m.line_name)}` : ""}<br>
              ${m.joined_at ? `加入 ${m.joined_at}　｜　` : ""}${
                m.status === "pending" ? `<span class="tagw">🔔 等待審核</span>${m.intro?`<br>「${esc(m.intro)}」`:""}${m.description?`<br>${esc(m.description)}`:""}`
                : m.status !== null ? `<span class="tagx">已退出${m.exit_date?" "+m.exit_date:""}</span>`
                : m.bound_at ? `<span class="okmark">✓ 已綁定 ${String(m.bound_at).slice(0,10)}</span>`
                : `<span class="tagw">還沒綁</span>`}</div>
          </span>
          <span class="actions" style="flex:none;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:230px">
            ${m.status === "pending"
              ? `<button class="mbtn add" onclick="reviewMember(${m.id},'approve','${escAttr(m.name||"")}')">核可</button>
                 <button class="mbtn" style="color:#b4261a;border-color:#e8b4ae" onclick="reviewMember(${m.id},'reject','${escAttr(m.name||"")}')">退回</button>`
            : m.status !== null
              ? `<button class="mbtn" onclick="unretireMember(${m.id}, '${escAttr(m.name||"")}')">加回來</button>`
              : `${m.bound_at ? `<button class="mbtn" onclick="unbindMember(${m.id}, '${escAttr(m.name||"")}')">解綁</button>` : ""}
                 ${m.id !== ME.id ? `<button class="mbtn" onclick="retireMember(${m.id}, '${escAttr(m.name||"")}')">退出</button>
                 <button class="mbtn" style="color:#b4261a;border-color:#e8b4ae" onclick="deleteMember(${m.id}, '${escAttr(m.name||"")}')">刪除</button>` : ""}`}
          </span>
        </div>`).join("") : `<div class="empty">這個分類沒有人</div>`}</div>
    </div>`;
}

// 幹部：誰綁了、綁在哪個名字上、綁錯了在這裡解除

async function unbindMember(id, name){
  if(!confirm(`確定要解除「${name}」的 LINE 綁定嗎？\n\n解除後他下次打開 App 會回到「你是哪一位？」重新選。\n他目前的登入也會失效。`)) return;
  const r = await fn("unbind", {member_id: id});
  if(r.error){ alert(r.error); return; }
  MADMIN = null; await openMemberAdmin();

// 報到台的一段名單。空的就不出現，不佔版面。
function boardSection(title, list, help, emptyText){
  if(!list.length){
    // 「報名了還沒到」是 0 的時候要講出來——那是好消息，不是沒東西可顯示
    return emptyText
      ? `<div style="margin:16px 0 4px;font-weight:800">${title}　<span class="mnote">0</span></div>
         <div class="mnote" style="padding:8px 0">✅ 報名的夥伴都到齊了</div>`
      : "";
  }
  return `<div style="margin:16px 0 4px;font-weight:800">${title}　<span class="mnote">${list.length} 人</span></div>
    ${help ? `<div class="help" style="margin-bottom:6px">${help}</div>` : ""}
    ${list.map(boardRow).join("")}`;
}

function boardRow(m){
  return `
          <div class="ckrow${m.checked ? " done" : ""}${!m.signed ? " nosign" : ""}">
            <div class="ckinfo">
              <b>${esc(m.name)}</b>${m.tag ? `　<span class="mnote">${esc(m.tag)}</span>` : ""}
              ${!m.signed ? `<span class="tagx">沒報名</span>` : ""}
              ${m.status === "waitlist" ? `<span class="tagw">候補</span>` : ""}
              <div class="cksub">${m.signed ? (m.meals || "沒訂餐") : "—"}${
                m.diet_note ? `　｜　⚠️ ${esc(m.diet_note)}` : ""}${
                m.checked && m.distance_m != null
                  ? `　｜　報到時距離會場 <b class="${m.distance_m > 500 ? "far" : ""}">${m.distance_m} 公尺</b>${
                      m.accuracy != null ? `（誤差 ±${Math.round(m.accuracy)} 公尺）` : ""}` : ""}</div>
              ${m.signed && !m.checked ? `
                <select class="absel" onchange="setAbsence(${m.id}, this.value)">
                  <option value="">沒到的話，選一個原因…</option>
                  ${ABSENCE.map(([k, label, d]) =>
                    `<option value="${k}">${label}${d ? `（扣 ${d} 分）` : "（不扣分）"}</option>`).join("")}
                </select>` : ""}
            </div>
            <button class="ckbtn${m.checked ? " on" : ""}" onclick="markCheck(${m.id}, null, ${m.checked})">${
              m.checked ? "✓ 到了" : "打勾"}</button>
          </div>`;
}
// datetime-local 要「當地時間」的字串；直接 toISOString 會變成 UTC，畫面上會少 8 小時
function toLocalInput(iso){
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function toggleCkCfg(){
  const c = el("ckcfg"); if(!c) return;
  c.style.display = c.style.display === "none" ? "block" : "none";
}
async function startCheckin(postId){
  const r = await checkinApi("open", {post_id: postId});
  if(!r || !r.ok){ alert((r && r.message) || "開啟失敗"); return; }
  await openBoard(postId);
}

async function markCheck(memberId, guestId, undo){
  const r = await checkinApi("mark", {post_id: BOARD_POST, member_id: memberId, guest_id: guestId, undo: !!undo});

// ── 報到碼與設定已併進報到台（openBoard），不再另開一頁 ──
function useHere(){
  if(!navigator.geolocation){ alert("這個瀏覽器拿不到定位"); return; }
  navigator.geolocation.getCurrentPosition(p => {
    el("ck_lat").value = p.coords.latitude.toFixed(6);
    el("ck_lng").value = p.coords.longitude.toFixed(6);
  }, () => alert("拿不到定位，請手動填或留空"));
}

// ⛔ 介紹人由後端從登入身分取，前端送什麼都不算數
let GUEST_PICK = {};
function guestsOf(postId){ return MY_GUESTS.filter(g => g.post_id === postId); }

// 月例會卡片上的來賓區
function guestBlock(p){
  if(!p.signup_open) return "";
  if(!ME) return "";
  const mine = guestsOf(p.id);
  // ⭐ 全場總額，不是每人上限（羅伯特 2026-08-29：「是來賓總數量是幾位」）
  const quota = p.guest_quota == null ? 10 : p.guest_quota;  // ⛔ 不能用 ||：設 0（不開放）會被當成沒設定
  // 全場數字來自 v_post_seats；讀不到就退回只顯示自己登記的，總量交給後端擋
  const all = (SEATS[p.id] || {}).guests_taken;
  const used = all == null ? mine.length : all;
  return `<div class="guestbox">
    <div class="guesthead">
      <span>來賓名額　<b>${used}</b> / ${quota}${
        mine.length ? `　<span class="mnote">我帶了 ${mine.length} 位</span>` : ""}</span>
      ${quota === 0 ? `<span class="mnote">這場不開放帶來賓</span>`
        : used < quota
        ? `<button class="cancelbtn" onclick="openGuest(${p.id})">＋ 登記來賓</button>`
        : `<span class="mnote">名額已滿</span>`}
    </div>
    ${mine.map(g => `<div class="guestrow">
      <span>${esc(g.name)}${g.company ? `　<span class="mnote">${esc(g.company)}</span>` : ""}${
        g.meal_choices && Object.keys(g.meal_choices).length
          ? `　<span class="mnote">${Object.entries(g.meal_choices).map(([k,v]) => esc(mealLabel(v))).join("・")}</span>` : ""}</span>
      <span>
        <button class="cancelbtn" onclick="openGuest(${p.id}, ${g.id})">改</button>
        <button class="cancelbtn" onclick="removeGuest(${g.id}, '${escAttr(g.name)}')">取消</button>
      </span></div>`).join("")}
  </div>`;
}

function pickGuestMeal(grp, id, gi, btn){
  GUEST_PICK[grp] = String(id);
  document.querySelectorAll(`#gg${gi} .pill`).forEach(x => x.classList.remove("on"));
  btn.classList.add("on");
}
async function submitGuest(postId, guestId, btn){
  const name = (el("g_name").value || "").trim();
  if(!name){ alert("請填來賓姓名"); return; }
  btn.disabled = true; btn.textContent = "送出中…";
  const body = {
    post_id: postId, id: guestId || undefined, name,
    company: el("g_company").value, title: el("g_title").value,
    phone: el("g_phone").value, industry: el("g_industry").value,
    diet_note: el("g_diet").value,
    meal_choices: Object.keys(GUEST_PICK).length ? GUEST_PICK : undefined,
  };
  const r = await guestApi(guestId ? "update" : "add", body);
  btn.disabled = false; btn.textContent = guestId ? "存起來" : "登記";
  if(r && r.ok){ await reloadSeats(); go(FORM_FROM); refreshCurrent(); alert(guestId ? "已更新" : `已登記來賓：${name}`); }
  else alert((r && r.message) || "登記失敗");
}
async function removeGuest(id, name){
  if(!confirm(`確定要取消來賓「${name}」嗎？`)) return;
  const r = await guestApi("remove", {id});
  await reloadSeats(); refreshCurrent();
  alert(r && r.ok ? `已取消來賓：${r.removed}` : ((r && r.message) || "取消失敗"));
}

          請先用 Chrome 或 Safari 開啟本站再按下載。

        </table></div>
