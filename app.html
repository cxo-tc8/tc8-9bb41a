<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO TC8｜AI 案例與活動中心</title>
<style>
:root{
  --blue-900:#15296B; --blue-700:#1E40A0; --blue-500:#2B57C4;
  --orange:#E76318; --orange-dark:#cf5413;
  --bg:#e8f0fa; --card:#ffffff; --text:#16181d; --muted:#5b6472;
  --line:#e2e7ef; --line-soft:#eef1f7;
  --chip:#eef2fb; --chip-text:#26418f;
  --ok:#1a7f4b; --warn:#b4531a;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  --nav-h:60px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 頂欄 ───────────────────────────── */
.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 58%,var(--blue-500) 100%);
  color:#fff; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
}
.top .logo{width:34px;height:34px;border-radius:9px;background:#fff2;display:grid;place-items:center;font-weight:800;font-size:.8rem;letter-spacing:.5px;flex:none}
.top h1{font-size:1.02rem;font-weight:800;letter-spacing:.5px;line-height:1.2}
.top .sub{font-size:.72rem;opacity:.82;font-weight:400;letter-spacing:0}
.top .me{margin-left:auto;display:flex;align-items:center;gap:7px;background:#ffffff26;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;min-height:36px}
.top .me .dot{width:7px;height:7px;border-radius:50%;background:#5fe0a0}

/* ── 版心 ───────────────────────────── */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 26px}
.view{display:none} .view.on{display:block}

/* ── 區塊標題 ───────────────────────── */
.sec{display:flex;align-items:baseline;gap:9px;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.sec h2{font-size:1.02rem;font-weight:800;letter-spacing:.3px}
.sec .more{margin-left:auto;font-size:.82rem;color:var(--blue-500);font-weight:600;min-height:44px;display:flex;align-items:center}


/* ── 卡片 ───────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:10px}

/* 月例會大卡 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hero .band{background:linear-gradient(135deg,var(--blue-900),var(--blue-500));color:#fff;padding:14px 16px}
.hero .band .kicker{font-size:.72rem;opacity:.85;letter-spacing:1.5px;font-weight:700}
.hero .band .t{font-size:1.18rem;font-weight:800;margin-top:3px;line-height:1.4}
.hero .body{padding:14px 16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.speaker{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.speaker .n{font-weight:700;font-size:.94rem}
.speaker .r{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;min-height:46px;border:none;border-radius:var(--r-sm);font-weight:700;font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,transform .12s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-dark)}
.btn-ghost{background:transparent;color:var(--blue-500);border:1.5px solid var(--line)}

.btn-sm{min-height:44px;font-size:.86rem;padding:0 15px;flex:none}

/* 公告 */
.notice{display:flex;gap:11px;padding:13px 15px;align-items:flex-start}
.notice .ic{width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;flex:none}
.notice .t{font-weight:700;font-size:.93rem;line-height:1.45}
.notice .d{font-size:.79rem;color:var(--muted);margin-top:2px}

/* 小活動：連結列 */
.linkrow{display:flex;align-items:center;gap:11px;padding:13px 15px;min-height:56px;border-bottom:1px solid var(--line-soft)}
.linkrow:last-child{border-bottom:none}
.linkrow .t{font-weight:600;font-size:.92rem;flex:1;min-width:0}
.linkrow .d{font-size:.78rem;color:var(--muted);margin-top:1px}
.linkrow .go{color:var(--muted);flex:none}

/* 問卷完成率 */
.survey{padding:14px 15px}
.survey .t{font-weight:700;font-size:.93rem}
.survey .d{font-size:.79rem;color:var(--muted);margin-top:2px}
.bar{height:9px;border-radius:99px;background:var(--line-soft);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-700),var(--blue-500))}
.rate{display:flex;justify-content:space-between;font-size:.79rem;color:var(--muted);margin-top:6px}
.rate b{color:var(--text);font-variant-numeric:tabular-nums}

/* ── 案例列（第一層）─────────────────── */
.caserow{display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-soft);cursor:pointer;min-height:64px;align-items:flex-start;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
.caserow:last-child{border-bottom:none}
.caserow:active{background:var(--line-soft)}
.caserow .t{font-weight:700;font-size:.97rem;line-height:1.45}
.caserow .by{font-size:.79rem;color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{background:var(--chip);color:var(--chip-text);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.free{background:transparent;color:var(--muted);border:1px solid var(--line)}
.caserow .go{color:var(--muted);flex:none;align-self:center}

/* ── 搜尋與篩選 ─────────────────────── */
.tools{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:40;background:var(--bg);padding:10px 0 8px;margin:-4px 0 6px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 12px;min-height:46px}
.search input{flex:1;border:none;outline:none;background:none;font-size:16px;min-width:0;min-height:44px}
.search .ic{color:var(--muted);flex:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-size:.82rem;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.chip.on{background:var(--blue-700);border-color:var(--blue-700);color:#fff}
.hint{font-size:.79rem;color:var(--muted);padding:2px 3px 0}

/* ── 案例詳情（第二層）──────────────── */
.back{display:flex;align-items:center;gap:7px;min-height:44px;font-weight:700;font-size:.9rem;color:var(--blue-500);margin:-2px 0 8px;background:none;border:none;cursor:pointer}

.detail{padding:17px 16px}
.detail h2{font-size:1.28rem;font-weight:800;line-height:1.4}
.author{display:flex;align-items:center;gap:10px;margin:13px 0 0;padding:12px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.block{margin-top:17px}
.block .lbl{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:1.2px;margin-bottom:5px}
.block p{font-size:.96rem;line-height:1.75}
.shot{margin-top:17px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--line-soft);display:grid;place-items:center;color:var(--muted);font-size:.82rem}
.share{margin-top:17px;background:var(--chip);border-radius:var(--r-sm);padding:13px 14px;display:flex;align-items:center;gap:11px}
.share .t{font-size:.88rem;font-weight:700;color:var(--chip-text)}
.share .d{font-size:.78rem;color:var(--muted);margin-top:1px}

/* ── 需求 ───────────────────────────── */
.needrow{padding:14px 15px;border-bottom:1px solid var(--line-soft)}
.needrow:last-child{border-bottom:none}
.needrow .t{font-weight:700;font-size:.96rem;line-height:1.45}
.needrow .by{font-size:.79rem;color:var(--muted);margin-top:3px}
.urg{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.urg.hot{background:#fdebe0;color:var(--warn)}
.urg.mid{background:var(--chip);color:var(--chip-text)}

.matchbox{margin-top:9px;background:var(--line-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:.83rem;color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.matchbox b{color:var(--text)}

/* ── 夥伴 ───────────────────────────── */
.mrow{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-soft);align-items:center}
.mrow:last-child{border-bottom:none}
.mrow .n{font-weight:700;font-size:.95rem}
.mrow .c{font-size:.79rem;color:var(--muted);margin-top:2px}
.badge{background:var(--orange);color:#fff;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.cnt{font-size:.78rem;color:var(--muted);flex:none;text-align:right;font-variant-numeric:tabular-nums}
.cnt b{display:block;font-size:1.05rem;color:var(--blue-500);font-weight:800}


/* ── 我的 ───────────────────────────── */
.mecard{padding:16px;display:flex;align-items:center;gap:13px}
.mecard .ava{width:52px;height:52px;font-size:1.1rem}
.mecard .n{font-weight:800;font-size:1.06rem}
.mecard .c{font-size:.82rem;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.79rem;color:var(--muted)}
.menu{margin-top:12px}
.menurow{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line-soft);min-height:56px;cursor:pointer}
.menurow:last-child{border-bottom:none}
.menurow .t{flex:1;font-weight:600;font-size:.94rem}
.menurow .ic{color:var(--muted);flex:none}
.officer-only{background:linear-gradient(135deg,#fff6ef,#fdeee3);border-color:#f6d5bd}


/* ── 底部導覽 ───────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:var(--nav-h);color:var(--muted);font-size:.68rem;font-weight:700;
}
.nav button.on{color:var(--blue-500)}

.nav button.on .ic{transform:translateY(-1px)}
.nav .ic{transition:transform .18s}

/* ── 桌面：改側欄 ───────────────────── */
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:212px}
  .nav{top:0;bottom:0;right:auto;width:212px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-top:78px;gap:2px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 20px;min-height:48px;font-size:.9rem}
  .nav button.on{background:var(--chip)}
  .top{padding-left:20px}
  .wrap{padding-top:22px}
  .tools{top:calc(54px)}
}
.proto{max-width:760px;margin:0 auto;padding:0 14px 18px}
.proto .b{background:#fff8e6;border:1px solid #f0dda8;color:#6b5518;border-radius:var(--r-sm);padding:10px 13px;font-size:.8rem;line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 夥伴卡片牆（64 人固定名冊，資訊一次看完，不收起來）── */
#v-members{max-width:1280px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:15px 16px 14px;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .18s,transform .12s}
.mcard:hover{box-shadow:0 2px 6px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.10)}
.mcard:active{transform:scale(.995)}
.mhead{display:flex;gap:11px;align-items:flex-start}
.mhead .ava{width:42px;height:42px;font-size:1rem}
.mhead .n{font-weight:800;font-size:1.02rem;line-height:1.35}
.mhead .t{font-size:.8rem;color:var(--muted);margin-top:2px}
.mhead .badge{margin-left:0;margin-top:0;align-self:flex-start;flex:none}
.itag{display:inline-block;background:var(--chip);color:var(--chip-text);font-size:.72rem;font-weight:700;
  padding:3px 9px;border-radius:6px;margin-top:7px}
.mco{font-weight:700;color:var(--blue-700);font-size:.9rem;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.mdesc{font-size:.85rem;line-height:1.7;color:var(--text);margin-top:8px}
.mline{font-size:.82rem;line-height:1.65;margin-top:7px}
.mline b{color:var(--orange);font-weight:800;margin-right:4px}
.mweb{font-size:.79rem;color:var(--blue-500);margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);word-break:break-all}
.mnone{font-size:.79rem;color:var(--muted);font-style:italic;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:9px}
.filters select{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-size:.9rem;cursor:pointer}
@media (max-width:640px){ .mgrid{grid-template-columns:1fr} }

/* ── 案例表單 ─────────────────────────────── */
.form{max-width:640px;margin:0 auto}
.field{margin-top:16px}
.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
.field .req{color:var(--orange);margin-left:3px}
.field .help{font-size:.79rem;color:var(--muted);margin-bottom:6px;line-height:1.6}
.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:11px 12px;font-size:16px;background:var(--card);min-height:48px;font-family:inherit;line-height:1.6}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue-500)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-size:.84rem;font-weight:700;
  padding:0 13px;min-height:44px;border-radius:999px;cursor:pointer;display:flex;align-items:center}
.pill.on{background:var(--blue-700);border-color:var(--blue-700);color:#fff}
.formbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--bg);
  padding:14px 0 6px;margin-top:20px;display:flex;gap:9px}
@media (min-width:1024px){.formbar{bottom:0}}
.cnt{font-size:.75rem;color:var(--muted);text-align:right;margin-top:3px}

/* ── 登入 / 認領 ───────────────────────────── */
.center{max-width:420px;margin:0 auto;padding:30px 16px}
.linebtn{display:flex;align-items:center;justify-content:center;gap:9px;background:#06C755;color:#fff;
  border:none;border-radius:var(--r-sm);min-height:52px;width:100%;font-size:1rem;font-weight:800;cursor:pointer}
.linebtn:active{opacity:.88}
.pick{max-height:56vh;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
.pick button{display:flex;width:100%;gap:11px;align-items:center;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line-soft);padding:13px 14px;min-height:56px;cursor:pointer}
.pick button:last-child{border-bottom:none}
.pick button:active{background:var(--line-soft)}
.pick .n{font-weight:700;font-size:.95rem}
.pick .c{font-size:.78rem;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem;line-height:1.8}
.err{background:#fdecea;border:1px solid #f5c2bc;color:#8f2c1e;border-radius:var(--r-sm);padding:11px 13px;font-size:.86rem;margin-top:12px}
.busy{text-align:center;color:var(--muted);padding:30px;font-size:.9rem}
</style>
</head>

<script>
const SB   = "https://fehubnmhohnkftjbozls.supabase.co";
const KEY  = "sb_publishable_2jEktDbnpORi6Tl0qE6Bvw_55_marVz";  // 公開金鑰，設計上就是要放前端
const LINE_CHANNEL_ID = "2011250229";
const REDIRECT = location.origin + location.pathname;
const FN = SB + "/functions/v1/auth";
// ⚠️ 不能用 select=* —— members 有刻意不授權的欄位（line_user_id），用 * 會整個查詢被拒
// 產業代碼→中文（沿用 v1 index.html 的對照表；tag 是自由填的，不能拿來分類）
const industryNames = {
  edu:"教育", health:"醫療保健", food:"餐飲", it:"資訊科技", mfg:"製造業",
  re:"不動產", mkt:"行銷顧問", ag:"農業", sport:"運動產業", retail:"零售",
  media:"媒體", trade:"貿易", fin:"金融", car:"汽車", other:"其他"
};
const MEMBER_FIELDS = "id,sort,name,officer,company,title,industry,tag,description,web,intro,resource,wish,topic,role";

let ME = null, MEMBERS = [], TAGS = [], CASES = [];
window.__tc8 = { get members(){return MEMBERS}, get me(){return ME} };
// 幹部頭銜有各種 emoji（🏆💰…），一律剝掉只留文字
const cleanTitle = t => (t||"").replace(/\p{Extended_Pictographic}|\uFE0F/gu,"").trim();
const DEBUG = new URLSearchParams(location.search).has("debug");
const DBGLOG = [];
function DBG(label, data){
  DBGLOG.push(label + ": " + JSON.stringify(data));
  if(!DEBUG) return;
  let box = document.getElementById("dbgbox");
  if(!box){ box = document.createElement("pre"); box.id="dbgbox";
    box.style.cssText="position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#111;color:#0f0;font-size:11px;padding:10px;z-index:9999;margin:0;white-space:pre-wrap";
    document.body.appendChild(box); }
  box.textContent = DBGLOG.join("\n");
}
const esc = s => (s??"").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el  = id => document.getElementById(id);
const token = () => localStorage.getItem("tc8_token");

async function rest(path){
  const r = await fetch(SB+"/rest/v1/"+path, {headers:{apikey:KEY, Authorization:"Bearer "+KEY}});
  if(!r.ok) throw new Error("讀取失敗 "+r.status);
  return r.json();
}
async function api(action, body){
  const h={"Content-Type":"application/json"}; const t=token(); if(t) h.Authorization="Bearer "+t;
  const r=await fetch(SB+"/functions/v1/cases",{method:"POST",headers:h,body:JSON.stringify({action,...body})});
  return r.json();
}
async function fn(action, body){
  const h = {"Content-Type":"application/json"};
  const t = token(); if(t) h.Authorization = "Bearer "+t;
  const r = await fetch(FN, {method:"POST", headers:h, body:JSON.stringify({action, ...body})});
  return r.json();
}

/* ── 分頁切換 ───────────────────────────── */
function go(v, btn){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  el("v-"+v).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if(btn===undefined) window.scrollTo(0,0);
  render(v);
}
document.querySelectorAll(".nav button").forEach(b=> b.onclick = ()=> go(b.dataset.v));

/* ── 登入 ───────────────────────────────── */
function lineLogin(){
  const state = Math.random().toString(36).slice(2);
  localStorage.setItem("tc8_state", state);   // 用 localStorage：LINE 授權可能換分頁，sessionStorage 會遺失
  location.href = "https://access.line.me/oauth2/v2.1/authorize?response_type=code"
    + "&client_id=" + LINE_CHANNEL_ID
    + "&redirect_uri=" + encodeURIComponent(REDIRECT)
    + "&state=" + state + "&scope=" + encodeURIComponent("openid profile");
}
function onMe(){ ME ? go("me") : lineLogin(); }

async function handleCallback(){
  const p = new URLSearchParams(location.search);
  const code = p.get("code"), state = p.get("state");
  if(!code) return false;
  const saved = localStorage.getItem("tc8_state");
  if(saved && state !== saved){
    history.replaceState({},"",REDIRECT);
    el("v-home").innerHTML = `<div class="center"><div class="err">
      登入驗證沒對上，請再按一次登入。<br><span style="font-size:.8rem">（若一直如此，換用同一個瀏覽器分頁再試）</span></div>
      <button class="linebtn" style="margin-top:12px" onclick="lineLogin()">再登入一次</button></div>`;
    return true;
  }
  el("v-home").innerHTML = '<div class="busy">登入中…</div>';
  const r = await fn("callback", {code, redirect_uri: REDIRECT});
  history.replaceState({},"",REDIRECT);
  DBG("callback 回傳", r);
  if(r.error){
    el("v-home").innerHTML = `<div class="center"><div class="err">登入失敗：${esc(r.error)}</div>
      <button class="linebtn" style="margin-top:12px" onclick="lineLogin()">再試一次</button></div>`;
    return true;
  }
  if(r.token) localStorage.setItem("tc8_token", r.token);
  if(r.status === "unbound"){ go("claim"); return true; }
  if(r.status === "bound"){ await loadMe(); go("me"); return true; }
  return false;
}

/* ── 畫面 ───────────────────────────────── */
const avatar = n => `<div class="ava">${esc((n||"?").slice(0,1))}</div>`;

function paintMe(){
  el("meName").textContent = ME ? ME.name : "登入";
  el("meDot").style.background = ME ? "#5fe0a0" : "#9aa4b2";
}

function render(v){
  if(v==="home") el("v-home").innerHTML = `
    <div class="sec"><h2>下一場月例會</h2></div>
    <div class="card"><div class="empty">還沒有活動<br><span style="font-size:.82rem">幹部發布後會出現在這裡</span></div></div>
    <div class="sec"><h2>公告</h2></div>
    <div class="card"><div class="empty">還沒有公告</div></div>
    <div class="sec"><h2>最新案例</h2>${CASES.length?`<span class="more" onclick="go('cases')">全部 ${CASES.length}</span>`:""}</div>
    <div class="card">${CASES.length ? CASES.slice(0,3).map(caseRow).join("")
      : `<div class="empty">還沒有人分享 AI 案例<br><span style="font-size:.82rem">${ME?'到「我的」寫下第一個':'用 LINE 登入後就能寫'}</span></div>`}</div>`;

  if(v==="members"){
    el("v-members").innerHTML = `
      <div class="tools">
        <div class="search"><svg class="ic" width="18" height="18"><use href="#i-search"/></svg>
          <input id="mq" placeholder="搜尋姓名、公司、產業、想找什麼…" oninput="filterMembers()"></div>
        <div class="filters">
          <select id="mind" onchange="filterMembers()"></select>
          <span class="hint" id="mcount"></span>
        </div>
      </div>
      <div class="mgrid" id="mlist"></div>`;
    const counts = {};
    MEMBERS.forEach(m => { const k=m.industry||"other"; counts[k]=(counts[k]||0)+1; });
    // 「其他」押底（v1 學到的：它是最大宗，排前面會蓋掉真正的產業）
    const opts = Object.entries(counts)
      .sort((a,b)=> (a[0]==="other")-(b[0]==="other") || b[1]-a[1])
      .map(([k,c])=>`<option value="${esc(k)}">${esc(industryNames[k]||k)}（${c}）</option>`).join("");
    el("mind").innerHTML = `<option value="">全部產業（${MEMBERS.length} 人）</option>` + opts;
    filterMembers();
  }

  if(v==="cases"){
    el("v-cases").innerHTML = `
      <div class="tools">
        <div class="search"><svg class="ic" width="18" height="18"><use href="#i-search"/></svg>
          <input id="cq" placeholder="搜你想解決的問題，例如：報價單" oninput="filterCases()"></div>
        <div class="chips" id="ctags"></div>
        <div class="hint">搜的是「問題」不是「工具」——你不知道該用什麼工具，才要來這裡。</div>
      </div>
      <div class="card" id="clist" style="margin-top:10px"></div>`;
    const counts={}; CASES.forEach(c=>(c.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
    el("ctags").innerHTML = `<button class="chip on" data-t="">全部 ${CASES.length}</button>` +
      TAGS.filter(t=>counts[t.slug]).map(t=>`<button class="chip" data-t="${t.slug}">${esc(t.label)} ${counts[t.slug]}</button>`).join("");
    el("ctags").onclick = e => { const c=e.target.closest(".chip"); if(!c) return;
      el("ctags").querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); filterCases(); };
    filterCases();
  }

  if(v==="needs") el("v-needs").innerHTML = `
    <div class="sec"><h2>大家想解的問題</h2></div>
    <div class="card"><div class="empty">還沒有人提出需求</div></div>`;

  if(v==="me") el("v-me").innerHTML = ME ? `
    <section class="card mecard">${avatar(ME.name)}
      <div style="flex:1"><div class="n">${esc(ME.name)}</div>
      <div class="c">已用 LINE 綁定${ME.role==="officer"?" ・ 幹部":""}</div></div></section>
    <div class="grid2">
      <div class="stat"><b>${CASES.filter(c=>c.member_id===ME.id).length}</b><span>我的案例</span></div>
      <div class="stat"><b>0</b><span>我的需求</span></div></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn btn-primary" onclick="openForm()"><svg width="17" height="17"><use href="#i-plus"/></svg>寫一個案例</button></div>
    <div class="card menu" style="margin-top:12px">
      <div class="menurow" onclick="openMember(${ME.id})"><svg class="ic" width="19" height="19"><use href="#i-me"/></svg><div class="t">我的公開頁面</div><svg class="go" width="18" height="18"><use href="#i-go"/></svg></div>
      <div class="menurow" onclick="logout()"><svg class="ic" width="19" height="19"><use href="#i-back"/></svg><div class="t">登出</div></div>
    </div>` : `
    <div class="center">
      <div class="card" style="padding:24px 18px;text-align:center">
        <div style="font-weight:800;font-size:1.05rem">用 LINE 登入</div>
        <div style="color:var(--muted);font-size:.86rem;margin:8px 0 18px;line-height:1.7">
          不用記密碼、不用記網址。<br>第一次登入時選出自己，之後就認得你了。</div>
        <button class="linebtn" onclick="lineLogin()">用 LINE 登入</button>
      </div></div>`;
}

const tagLabel = slug => (TAGS.find(t=>t.slug===slug)||{}).label || slug;
const memberName = id => (MEMBERS.find(m=>m.id===id)||{}).name || "已退出的夥伴";
const ago = iso => { const d=(Date.now()-new Date(iso))/864e5;
  return d<1?"今天":d<2?"昨天":d<8?`${Math.floor(d)} 天前`:d<31?`${Math.floor(d/7)} 週前`:`${Math.floor(d/30)} 個月前`; };

function caseRow(c){
  return `<button class="caserow" onclick="openCase(${c.id})">
    <div style="flex:1;min-width:0">
      <div class="t">${esc(c.title)}</div>
      <div class="by">${esc(memberName(c.member_id))}　・　${ago(c.created_at)}</div>
      <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(tagLabel(t))}</span>`).join("")}
        ${(c.tools||[]).slice(0,2).map(t=>`<span class="tag free">${esc(t)}</span>`).join("")}</div>
    </div><svg class="go" width="18" height="18"><use href="#i-go"/></svg></button>`;
}

function filterCases(){
  const q=(el("cq")?.value||"").trim().toLowerCase();
  const tag=el("ctags")?.querySelector(".chip.on")?.dataset.t || "";
  const hit=CASES.filter(c=>{
    if(tag && !(c.tags||[]).includes(tag)) return false;
    if(!q) return true;
    return [c.title,c.problem,c.how,c.detail,memberName(c.member_id),...(c.tools||[])]
      .some(x=>(x||"").toLowerCase().includes(q));
  });
  el("clist").innerHTML = hit.map(caseRow).join("") ||
    `<div class="empty">${CASES.length? "沒有符合的案例" : "還沒有人分享 AI 案例<br><span style=\"font-size:.82rem\">"+(ME?"到「我的」寫下第一個":"用 LINE 登入後就能寫")+"</span>"}</div>`;
}

function openCase(id){
  const c=CASES.find(x=>x.id===id); if(!c) return;
  const mine = ME && c.member_id===ME.id;
  const share={dm:"可以私訊我",stage:"願意上台分享",none:"暫時不方便"}[c.share_level];
  el("v-cdetail").innerHTML = `
    <button class="back" onclick="go('cases')"><svg width="17" height="17"><use href="#i-back"/></svg>案例</button>
    <article class="card detail">
      <h2>${esc(c.title)}</h2>
      <div class="author">${avatar(memberName(c.member_id))}
        <div style="flex:1"><div style="font-weight:700">${esc(memberName(c.member_id))}</div>
          <div style="font-size:.79rem;color:var(--muted)">${esc(c.term)} 會期　・　${ago(c.created_at)}</div></div>
        ${mine?`<button class="btn btn-ghost btn-sm" onclick="openForm(${c.id})">修改</button>`:""}
      </div>
      <div class="block"><div class="lbl">解決什麼問題</div><p>${esc(c.problem)}</p></div>
      ${(c.tools||[]).length?`<div class="block"><div class="lbl">用什麼工具</div><div class="tags">${c.tools.map(t=>`<span class="tag free">${esc(t)}</span>`).join("")}</div></div>`:""}
      <div class="block"><div class="lbl">怎麼做的</div><p>${esc(c.how)}</p></div>
      ${c.detail?`<div class="block"><div class="lbl">補充細節</div><p>${esc(c.detail)}</p></div>`:""}
      ${(c.tags||[]).length?`<div class="block"><div class="lbl">分類</div><div class="tags">${c.tags.map(t=>`<span class="tag">${esc(tagLabel(t))}</span>`).join("")}</div></div>`:""}
      ${share?`<div class="share"><svg width="20" height="20" style="color:var(--chip-text);flex:none"><use href="#i-spark"/></svg>
        <div style="flex:1"><div class="t">願意分享：${esc(share)}</div>
        <div class="d">有同樣困擾的夥伴可以找他</div></div></div>`:""}
      ${mine?`<div style="margin-top:18px;text-align:center"><button class="btn btn-ghost btn-sm" style="color:#b4261a" onclick="delCase(${c.id})">刪除這則案例</button></div>`:""}
    </article>`;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  el("v-cdetail").classList.add("on"); window.scrollTo(0,0);
}

function openForm(id){
  if(!ME){ go("me"); return; }
  const c = id ? CASES.find(x=>x.id===id) : null;
  el("v-form").innerHTML = `
    <button class="back" onclick="go('me')"><svg width="17" height="17"><use href="#i-back"/></svg>取消</button>
    <div class="form">
      <div style="font-weight:800;font-size:1.15rem">${c?"修改案例":"寫一個 AI 案例"}</div>
      <div style="color:var(--muted);font-size:.85rem;margin-top:5px;line-height:1.7">
        講一件你實際用 AI 做過的事就好，不必是大專案。兩分鐘填得完。</div>

      <div class="field"><label>標題<span class="req">*</span></label>
        <div class="help">一句話講完，別人是靠這行決定要不要點進來</div>
        <input type="text" id="f_title" maxlength="60" value="${c?esc(c.title):""}" placeholder="例：報價單從 40 分鐘變 3 分鐘">
      </div>

      <div class="field"><label>解決什麼問題<span class="req">*</span></label>
        <div class="help">大家是用「問題」在搜尋的，寫得越具體越有人找得到</div>
        <textarea id="f_problem" maxlength="500" placeholder="例：每次客戶問價格，我要翻三個檔案再手算，一份要 40 分鐘">${c?esc(c.problem):""}</textarea>
      </div>

      <div class="field"><label>用什麼工具</label>
        <div class="help">用逗號分開，例如：ChatGPT, Excel</div>
        <input type="text" id="f_tools" value="${c?esc((c.tools||[]).join(", ")):""}" placeholder="ChatGPT, Google 試算表">
      </div>

      <div class="field"><label>怎麼做的<span class="req">*</span></label>
        <div class="help">兩三句就好。沒有這段，別人學不走</div>
        <textarea id="f_how" maxlength="1000" placeholder="例：把報價邏輯講給 AI 聽，請它做成一張表，填三個數字就出價">${c?esc(c.how):""}</textarea>
      </div>

      <div class="field"><label>分類</label>
        <div class="help">最多選 3 個。選項是固定的——大家各寫各的，之後就配對不起來</div>
        <div class="pills" id="f_tags">${TAGS.map(t=>`<button type="button" class="pill${c&&(c.tags||[]).includes(t.slug)?" on":""}" data-t="${t.slug}">${esc(t.label)}</button>`).join("")}</div>
      </div>

      <div class="field"><label>補充細節</label>
        <div class="help">踩過的坑、沒做成的部分，這段常常最有價值</div>
        <textarea id="f_detail" maxlength="3000" placeholder="選填">${c?esc(c.detail||""):""}</textarea>
      </div>

      <div class="field"><label>願意讓人來問嗎</label>
        <div class="pills" id="f_share">
          ${[["dm","可以私訊我"],["stage","願意上台分享"],["none","暫時不方便"]]
            .map(([v,l])=>`<button type="button" class="pill${c&&c.share_level===v?" on":""}" data-s="${v}">${l}</button>`).join("")}</div>
      </div>

      <div id="f_err"></div>
      <div class="formbar">
        <button class="btn btn-ghost" onclick="go('me')">取消</button>
        <button class="btn btn-primary" id="f_save" onclick="saveCase(${c?c.id:"null"})">${c?"儲存修改":"送出"}</button>
      </div>
    </div>`;
  el("f_tags").onclick = e => { const p=e.target.closest(".pill"); if(!p) return;
    const on=el("f_tags").querySelectorAll(".pill.on").length;
    if(!p.classList.contains("on") && on>=3) return;
    p.classList.toggle("on"); };
  el("f_share").onclick = e => { const p=e.target.closest(".pill"); if(!p) return;
    el("f_share").querySelectorAll(".pill").forEach(x=>x.classList.remove("on")); p.classList.add("on"); };
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  el("v-form").classList.add("on"); window.scrollTo(0,0);
}

async function saveCase(id){
  const btn=el("f_save"); btn.disabled=true; btn.textContent="送出中…";
  const body={
    id, title: el("f_title").value, problem: el("f_problem").value, how: el("f_how").value,
    detail: el("f_detail").value,
    tools: el("f_tools").value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),
    tags: [...el("f_tags").querySelectorAll(".pill.on")].map(x=>x.dataset.t),
    share_level: el("f_share").querySelector(".pill.on")?.dataset.s || null,
  };
  const r = await api(id?"update":"create", body);
  if(r.error){ el("f_err").innerHTML=`<div class="err">${esc(r.error)}</div>`;
    btn.disabled=false; btn.textContent=id?"儲存修改":"送出"; return; }
  await reloadCases();
  openCase(r.case.id);
}

async function delCase(id){
  if(!confirm("確定要刪除這則案例嗎？刪了就沒了。")) return;
  const r = await api("delete", {id});
  if(r.error) return alert(r.error);
  await reloadCases(); go("cases");
}

async function reloadCases(){
  CASES = await rest("ai_cases?select=id,member_id,title,problem,tools,how,detail,tags,term,share_level,created_at&order=created_at.desc");
}

function memberCard(m){
  const line = (lbl,v) => v ? `<div class="mline"><b>${lbl}</b>${esc(v)}</div>` : "";
  return `<article class="mcard" onclick="openMember(${m.id})">
    <div class="mhead">
      ${avatar(m.name)}
      <div style="flex:1;min-width:0">
        <div class="n">${esc(m.name)}</div>
        <div class="t">${esc(m.title||"")}</div>
        ${m.tag?`<span class="itag">${esc(m.tag)}</span>`:""}
      </div>
      ${m.officer?`<span class="badge">${esc(cleanTitle(m.officer))}</span>`:""}
    </div>
    ${m.company?`<div class="mco">${esc(m.company)}</div>`:""}
    ${m.description?`<div class="mdesc">${esc(m.description)}</div>`:""}
    ${m.intro?`<div class="mline" style="color:var(--blue-700);font-style:italic">「${esc(m.intro)}」</div>`:""}
    ${line("可提供：", m.resource)}
    ${line("想找：", m.wish)}
    ${line("關注：", m.topic)}
    ${m.web?`<div class="mweb">${esc(m.web.replace(/^https?:\/\//,""))}</div>`:`<div class="mnone">尚無官方網站資料</div>`}
  </article>`;
}

function filterMembers(){
  const q = (el("mq")?.value||"").trim().toLowerCase();
  const ind = el("mind")?.value || "";
  const hit = MEMBERS.filter(m=>{
    if(ind && (m.industry||"other")!==ind) return false;
    if(!q) return true;
    return [m.name,m.company,m.tag,m.title,m.description,m.intro,m.resource,m.wish,m.topic]
      .some(x=>(x||"").toLowerCase().includes(q));
  });
  el("mlist").innerHTML = hit.map(memberCard).join("") || '<div class="empty" style="grid-column:1/-1">找不到符合的夥伴</div>';
  el("mcount").textContent = `${hit.length} 位`;
}

function openMember(id){
  const m = MEMBERS.find(x=>x.id===id); if(!m) return;
  const blk = (l,v)=> v ? `<div class="block"><div class="lbl">${l}</div><p>${esc(v)}</p></div>` : "";
  el("v-mdetail").innerHTML = `
    <button class="back" onclick="go('members')"><svg width="17" height="17"><use href="#i-back"/></svg>夥伴</button>
    <article class="card detail">
      <div style="display:flex;gap:13px;align-items:center">
        <div class="ava" style="width:58px;height:58px;font-size:1.2rem">${esc(m.name.slice(0,1))}</div>
        <div style="flex:1"><h2 style="font-size:1.2rem">${esc(m.name)}${m.officer?`<span class="badge">${esc(cleanTitle(m.officer))}</span>`:""}</h2>
        <div style="font-size:.85rem;color:var(--muted);margin-top:3px">${esc([m.tag,m.company,m.title].filter(Boolean).join(" ・ "))||"資料待補"}</div></div>
      </div>
      ${blk("一句話自介", m.intro)}
      ${blk("我可以提供的資源", m.resource)}
      ${blk("我想在 TC8 獲得", m.wish)}
      ${blk("關注主題", m.topic)}
      ${blk("簡介", m.description)}
      ${m.web?`<div class="block"><div class="lbl">網站</div><p><a href="${esc(m.web)}" target="_blank" rel="noopener" style="color:var(--blue-500)">${esc(m.web)}</a></p></div>`:""}
    </article>
    <div class="sec"><h2>他的 AI 案例</h2></div>
    <div class="card"><div class="empty">還沒有案例</div></div>`;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  el("v-mdetail").classList.add("on"); window.scrollTo(0,0);
}

/* ── 認領身分 ───────────────────────────── */
async function renderClaim(){
  el("v-claim").innerHTML = '<div class="busy">載入名單…</div>';
  const r = await fn("claimable");
  if(r.error){ el("v-claim").innerHTML = `<div class="center"><div class="err">${esc(r.error)}</div></div>`; return; }
  el("v-claim").innerHTML = `
    <div class="center">
      <div style="font-weight:800;font-size:1.1rem;margin-bottom:4px">你是哪一位？</div>
      <div style="color:var(--muted);font-size:.86rem;margin-bottom:14px;line-height:1.7">
        選出自己，之後這個 LINE 就代表你，不用再選。<br>
        找不到自己、或不小心選錯了，找幹部處理。</div>
      <input class="search" style="width:100%;margin-bottom:10px;padding:0 12px" placeholder="輸入名字快速找" oninput="filterClaim(this.value)">
      <div class="pick" id="picklist"></div>
      <div id="claimErr"></div>
    </div>`;
  window.__claimable = r.members;
  filterClaim("");
}
function filterClaim(q){
  q=(q||"").trim().toLowerCase();
  const list=(window.__claimable||[]).filter(m=>!q||(m.name||"").toLowerCase().includes(q));
  el("picklist").innerHTML = list.map(m=>`<button onclick="doClaim(${m.id},'${esc(m.name).replace(/'/g,"")}')">
    <div class="ava">${esc((m.name||"?").slice(0,1))}</div>
    <div style="flex:1"><div class="n">${esc(m.name)}</div><div class="c">${esc([m.tag,m.company].filter(Boolean).join(" ・ "))||"資料待補"}</div></div>
    </button>`).join("") || '<div class="empty">沒有可選的名字，請找幹部</div>';
}
async function doClaim(id, name){
  if(!confirm(`確定你是「${name}」嗎？\n綁定後要改需要請幹部解除。`)) return;
  const r = await fn("claim", {member_id:id});
  if(r.error){ el("claimErr").innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  await loadMe(); go("me");
}

function logout(){ localStorage.removeItem("tc8_token"); ME=null; paintMe(); go("home"); }

/* ── 啟動 ───────────────────────────────── */
async function loadMe(){
  const r = await fn("me");
  DBG("me 回傳", r);
  ME = r.status==="bound" ? r.member : null;
  paintMe();
  return r.status;
}
(async function init(){
  DBG("啟動", {網址:location.href, 有通行證:!!token(), 有授權碼:new URLSearchParams(location.search).has("code")});
  try{
    [MEMBERS, TAGS, CASES] = await Promise.all([
      rest("members?select=" + MEMBER_FIELDS + "&order=sort.asc"),
      rest("tag_vocab?select=slug,label&active=is.true&order=sort.asc"),
      rest("ai_cases?select=id,member_id,title,problem,tools,how,detail,tags,term,share_level,created_at&order=created_at.desc"),
    ]);
  }
  catch(e){ MEMBERS = []; window.__tc8err = String(e); console.error("載入夥伴失敗", e); }
  const jumped = await handleCallback();
  const st = await loadMe();
  if(!jumped && st==="unbound"){ go("claim"); return; }
  if(el("v-claim").classList.contains("on")) return renderClaim();
  go("home");
})();
const _go = go;
go = function(v, b){ _go(v,b); if(v==="claim") renderClaim(); };
</script>
